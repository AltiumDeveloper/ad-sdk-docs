# EDP.INetItem: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The INetItem interface represents the ancestor or parent interface for the following interfaces - IBus,
  ICrossSheetConnector, IPin, IPort, INetlabel, ISheetEntry and IPowerObject interfaces that have a Net property.
remarks: These interface objects have a net property and thus these objects can be part of a net.
members:
  DM_BusIndex:
    summary: The method returns the bus index. An IBus interface is inherited from a INetItem interface.
  DM_BusKind:
    summary: The method returns the type of bus. An IBus interface is inherited from a INetItem interface.
  DM_BusPrefix:
    summary: The method returns the bus prefix. An example, a bus object could have this A0..7 net label, and the prefix is
      A. An IBus interface is inherited from a INetItem interface.
  DM_BusRange1:
    summary: This method returns the bus range 1 string.
  DM_BusRange2:
    summary: This method returns the bus range 1 string.
  DM_BusRangeValue1:
    summary: This method returns value of the bus range 1.
  DM_BusRangeValue2:
    summary: This method returns value of the bus range 1.
  DM_BusWidth:
    summary: The method returns the bus width. An IBus interface is inherited from a INetItem interface.
  DM_DisplayMode:
    summary: The method returns the display mode for this part object. A part object can have up to 254 alternative
      graphical displays along with the normal graphical display.
  DM_Electric:
    summary: This method denotes the electrical pin property for a net aware object.
    seeAlso:
      - EDP.TPinElectrical
  DM_Electrical:
    summary: The method returns the electrical pin property.
    seeAlso:
      - EDP.TPinElectrical
  DM_ElectricalString:
    summary: The method returns the electrical property string.
  DM_FlattenedNetName:
    summary: The method returns the net name of the flattened net where the net aware object is associated with.
  DM_FullLogicalPartDesignator:
    summary: The method returns the logical part designator and the channel instance for this INetItem Interface.
  DM_FullPhysicalPartDesignator:
    summary: The method returns the full logical part designator and the channel instance for this INetItem Interface.
  DM_FullPinName:
    summary: The method returns the full Pin name and number that this INetItem interface is associated with. An IPin
      interface is inherited from an INetItem interface.
  DM_FullUniqueId:
    summary: The method returns the full Unique ID string for this INetItem interface.
  DM_Id:
    summary: The method returns the Id value for this net aware object.
  DM_IsAutoGenerated:
    summary: The method returns a Boolean value whether this INetItem has been automatically generated by Atlium Designer or
      not.
  DM_IsBusElement:
    summary: The method returns a Boolean value whether this bus element exists or not for this INetItem interface. An IBus
      interface is inherited from a INetItem interface.
  DM_IsBusMember:
    summary: The method returns a Boolean value whether this bus member exists or not for this INetItem interface. An IBus
      interface is inherited from a INetItem interface.
  DM_IsBusSection:
    summary: The method returns a Boolean value whether the bus section exists or not for this INetItem interface. An IBus
      interface is inherited from a INetItem interface.
  DM_IsHidden:
    summary: The method returns whether this pin object is hidden or not. An IPin interface is inherited from an INetItem
      interface.
  DM_LinkObject:
    summary: The method denotes the linked object to a sheet entry or port from a port or a sheet entry respectively. This
      method is for port objects that are connected from child schematic sheets to sheet entries of sheet symbols on a
      parent sheet.
  DM_LogicalPartDesignator:
    summary: The method returns the logical part designator for this INetItem interface.
  DM_NetName:
    summary: The method returns the net name of the net where the net aware object is associated with.
  DM_OwnerNetLogical:
    summary: The method denotes whether this net aware object is associated with the net of a logical document.
  DM_OwnerNetPhysical:
    summary: The method denotes whether this net aware object is associated with the net of a physical document.
  DM_ParentID:
    summary: The method denotes the parent ID or the Sheet document name / Net Name property where this interface is
      associated with. For example a sheet entry on a sheet symbol object's parent ID is the name of the schematic sheet
      where the port is.
  DM_ParentSheetSymbolName:
    summary: The method Returns the parent sheet symbol name associated with this INetItem interface (which is a SheetEntry
      object).
  DM_ParentSheetSymbolSheetName:
    summary: The method returns the parent sheet symbol sheet name string associated with this INetItem interface (which is
      a sheet entry object).
  DM_Part:
    summary: The method returns the IPart interface.
  DM_PartSwapId:
    summary: The method returns the wide string for the part swap Id.
  DM_PartType:
    summary: The method returns the part type for this INetItem associated with an IPart object.
  DM_PartUniqueId:
    summary: The method returns the Unique ID for this part the NetItem is associated with.
  DM_PhysicalPartDesignator:
    summary: The method returns the logical part designator and the channel instance for this INetItem Interface.
  DM_PinName:
    summary: The method returns the Pin name that this INetItem interface is associated with. Since an IPin interface is
      inherited from an INetItem interface.
  DM_PinNameNoPartId:
    summary: The method returns the Pin Name Number and Part ID string for this INetItem associated with an Part object. A
      pin is part of a part / component.
  DM_PinNumber:
    summary: The method returns the Pin Number that this INetItem interface is associated with. An IPin interface is
      inherited from an INetItem interface.
  DM_PinSwapId:
    summary: The method returns the wide string for the pin swap Id.
  DM_RangeDefinedByValue:
    summary: The method returns a Boolean value whether the range is defined by a two specific range values or not.
  DM_SheetSymbol:
    summary: The method returns the ISheetSymbol interface where this INetItem (representing a ISheetEntry interface if it
      exists) is associated with. If not, a nil value is returned.
  DM_SignalType:
    summary: The method returns the signal type string.
