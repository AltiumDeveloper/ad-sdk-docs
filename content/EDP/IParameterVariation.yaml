# EDP.IParameterVariation: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The IParameterVariation interface represents the component that contains parameter variations. Physically,
  there is only one PCB document with components that are specified. So for each output requirement, each document
  variant is generated, although there is only one PCB design document.
members:
  DM_ParameterName:
    summary: Denotes the name of the parameter that the component is associated with.
  DM_VariedValue:
    summary: Denotes the value of the parameter that the component is associated with. A component variant can have
      parameter variants.
