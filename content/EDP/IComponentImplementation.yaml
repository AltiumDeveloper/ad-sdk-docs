# EDP.IComponentImplementation: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The IComponentImplementation interface is associated with an IPart/IComponent interface in terms of model
  linking. Note that the IComponent interface is inherited from the IPart interface.
remarks: >-
  A model represents all the information needed for a component in a given domain (a model can be a PCB footprint,
  Simulation file or a Signal Integrity model). A model is also called an implementation.


  Each schematic component can contain links to different model implementations such as PCB, Signal Integrity and
  Simulation models. Only one model of a particular model type (PCB footprint, SIM, SI, EDIF Macro and VHDL) can be
  enabled as the currently linked model, at any one time.


  A model can be represented by external data sources called data file links. For example, pins of a component can have
  links to different data files, as for signal integrity models. We will consider each model type in respect to the data
  file links.


  For PCB footprints, the data file link and the model is the same since the external file is the PCB footprint library.


  For simulation models, there can be no data file links because these models are defined using the Spice format.


  However for signal integrity models, each pin can have different pieces of information represented by ibis data files.
  These signal integrity models can have multiple data files, that is, each pin of a component can have a separate IBIS
  file. A signal integrity model can however use the Altium Designer's central Signal Integrity database.


  Thus depending on which model type, you can have a number of data file links. Each data file link describes the model
  name, the path to where the library is stored in and what sort of model it is.
members:
  DM_DatafileCount:
    summary: The method returns the number of data files for the model. A data file is an internal aggregrate object and
      each data file describes the model name, the path to where the library is stored in and what implementation model
      type.
  DM_DatafileEntity:
    summary: The method returns the indexed data file entity (the name of the implementation model). Used in conjunction
      with the DM_DataFileCount method.
  DM_DatafileFullPath:
    summary: The method returns you the full path to the data file via the FoundIn parameter, if the Entity name, the file
      Kind are valid and Found In strings Used in conjunction with the DM_DataFileCount method.
  DM_DatafileKind:
    summary: The method returns the indexed data file kind (the model kind eg PCB etc)Used in conjunction with the
      DM_DataFileCount method.
  DM_DatafileLocation:
    summary: The method returns the indexed data file location. Used in conjunction with the DM_DataFileCount method.
  DM_DatalinksLocked:
    summary: The method denotes a boolean value whether datalinks are locked or not. Note, a data file kind denotes the type
      of implementation model. Example, a PCB Footprint is a PCBLIB data file kind.
  DM_Description:
    summary: The method returns the description string of the implementation model.
  DM_IntegratedModel:
    summary: This method denotes a boolean value whether this is a model from an integrated library or not.
  DM_IsCurrent:
    summary: The method denotes a boolean value whether this model implementation is current or not.
  DM_ModelName:
    summary: The method returns the model name of the implementation model.
  DM_ModelType:
    summary: The method returns the model type as a string;
  DM_Part:
    summary: The method denotes the mapping of pins of a component and its corresponding model.
  DM_PortMap:
    summary: The method denotes the mapping of pins of a component and its corresponding model.
  DM_PortMapList:
    summary: The method returns the mapping of pins of a component and its corresponding model.
  DM_SetDatafileCount:
    summary: The method sets the number of data files associated with the IPart/IComponent interface.
  DM_SetDatafileEntity:
    summary: The method sets the data file entity which denotes the name of the implementation model linked to a schematic
      component/part.
  DM_SetDatafileKind:
    summary: The method sets the data file kind which denotes the type of implementation model. Example, a PCB Footprint is
      a PCBLIB data file kind.
  DM_SetDatafileLocation:
    summary: The method sets the data file location which denotes the full path of the implementation model associated with
      the IPart/IComponent interface.
