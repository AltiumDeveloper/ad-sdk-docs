# EDP.INet: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The INet interface is associated with an existing net object of a design document. A net is a series of
  connections of net identifiers (electrically aware objects such as sheet entries, pins, wires and ports) with the same
  net name.
remarks: That is, all connections sharing the same net name is a net and can be connected on a sheet or between sheets
  in a project.
members:
  DM_AllNetItemCount:
    summary: The method returns the number of net aware objects (that is inherited from the INetItem interface).
  DM_AllNetItems:
    summary: The method returns an indexed net aware object. Use the DM_AllNetItemCount method for this method.
    seeAlso:
      - EDP.INet.DM_AllNetItemCount
  DM_AutoNumber:
    summary: The method returns the auto number value used for auto-numbering nets.
  DM_BusIndex:
    summary: The method returns the bus index. An IBus interface is inherited from a INetItem interface.
  DM_BusKind:
    summary: The method returns the bus kind. which is one of the following enumerated values; eBusKindUndefined,
      eBusKindLowValueFirst, eBusKindHighValueFirst, eBusKindGeneric.
  DM_BusPrefix:
    summary: The method returns the bus prefix as used in this net.
  DM_BusRange1:
    summary: The method returns the first index of the Bus range. Eg. A1..6, the bus range1 is 1.
  DM_BusRange2:
    summary: The method returns the last index of the Bus Range. Eg A0..4, the bus range 2 is 4.
  DM_BusRangeValue1:
    summary: The method returns the value of the first index of the Bus range
  DM_BusRangeValue2:
    summary: The method returns the value of the second index of the Bus range.
  DM_BusSectionParent:
    summary: This method returns an INet interface for the parent bus section.
  DM_BusWidth:
    summary: The method returns the bus width. An IBus interface is inherited from a INetItem interface.
  DM_CalculatedNetName:
    summary: The method returns the bus width. An IBus interface is inherited from a INetItem interface.
  DM_CountOfElectricalType:
    summary: The method returns the number of electrical types used by the current sheet or the project.
  DM_CountOfNonPinItems:
    summary: The method returns the number of non-pin objects used on the current sheet or the project.
  DM_CrossSheetConnectorCount:
    summary: The method returns the number of cross sheet connectors associated with this net.
  DM_CrossSheetConnectors:
    summary: The method returns an indexed cross sheet connector that is part of the current net. Use the
      DM_CrossSheetConnectorCount method.
  DM_DirectiveCount:
    summary: The method returns the number of directives associated with this net.
  DM_Directives:
    summary: The method returns an indexed directive (which could be a PCB layout directive that contains PCB fules). Use
      the DM_DirectiveCount method.
  DM_Electric:
    summary: The method returns the type of electrical property the pin is associated with. Various values include
      :eElectricInput, eElectricIO, eElectricOutput, eElectricOpenCollector, eElectricPassive, eElectricHiZ,
      eElectricOpenEmitter, eElectricPower
    seeAlso:
      - EDP.TPinElectrical
  DM_ElectricalString:
    summary: The method returns the electrical property associated with this net.
  DM_FullNetName:
    summary: "{Including Bus Index etc}"
    remarks: The method denotes the full net name (includes the bus index and so on).
  DM_HiddenNetName:
    summary: The method denotes the hidden net name (like power nets).
  DM_IsAutoGenerated:
    summary: The method denotes a boolean value whether this net has been system generated or not.
  DM_IsBusElement:
    summary: The method returns a Boolean value whether this bus element exists or not for this INetItem interface. An IBus
      interface is inherited from a INetItem interface.
  DM_IsBusMember:
    summary: The method returns a Boolean value whether this bus member exists or not for this INetItem interface. An IBus
      interface is inherited from a INetItem interface.
  DM_IsBusSection:
    summary: The method returns a Boolean value whether the bus section exists or not for this INetItem interface. An IBus
      interface is inherited from a INetItem interface.
  DM_IsLocal:
    summary: The method denotes whether this net is a local net restricted to the document or not.
  DM_LineCount:
    summary: The method returns the number of lines associated with this net.
  DM_Lines:
    summary: The method returns an indexed line that is part of the current net. use the DM_LineCount method.
  DM_NetLabelCount:
    summary: The method returns the number of net labels associated with this net.
  DM_NetLabels:
    summary: The method returns an indexed net label that is part of the current net. Use DM_NetLabelCount method.
    seeAlso:
      - EDP.INetItem
  DM_NetName:
    summary: The method denotes the net name of this net.
  DM_NetNumber:
    summary: The method denotes the net number of this net.
  DM_PinCount:
    summary: The method returns the number of pins associated with this net.
  DM_Pins:
    summary: The method reurns an indexed pin that is part of the current net. Use the DM_PinCount method.
  DM_PortCount:
    summary: The method returns the number of ports associated with this net.
  DM_Ports:
    summary: The method returns an indexed port that is part of the current net. Use the DM_PortCount method.
  DM_PowerObjectCount:
    summary: The method returns the number of power objects associated with this net.
  DM_PowerObjects:
    summary: The method returns an indexed power object that is part of the current net. Use the DM_PowerObjectCount method.
  DM_RangeDefinedByValue:
    summary: The method returns a boolean value whether the range has been defined by a two specific range values or not.
  DM_RemovedNetItemCount:
    summary: The method returns the number of net items that have been removed from the nets.
  DM_RemovedNetItems:
    summary: The method returns an indexed net item that has been removed from net of the schematic document.
  DM_Scope:
    summary: The funciton denotes the scope of this net as defined by the TNetScope type.
    seeAlso:
      - EDP.TNetScope
  DM_SheetEntryCount:
    summary: The method returns the number of sheet entries associated with this net.
  DM_SheetEntrys:
    summary: The method returns an indexed sheet entry that is part of the current net. Use DM_SheetEntryCount method.
    seeAlso:
      - EDP.INetItem
      - EDP.INet.DM_SheetEntryCount
  DM_SignalType:
    summary: The method returns the signal type property associated with this net.
  DM_SubWireCount:
    summary: The method returns the number of sub wires associated with this net.
  DM_SubWires:
    summary: "{For BusSections only}"
    remarks: The method Returns an indexed sub wire (part of a bus object). Use the DM_SubWireCount. A bus object
      conceptually carries multiple wires.
  DM_SuppressERC:
    summary: The method returns a boolean value whether the ERC has been suppressed for this net or not.
