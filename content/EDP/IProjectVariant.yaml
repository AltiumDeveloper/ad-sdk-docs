# EDP.IProjectVariant: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: >-
  The IProjectVariant interface represents a variant of the project: a named set of component variations. Physically,
  there is only one PCB document with components that are specified. So for each output requirement, each document
  variant is generated, although there is only one PCB design document.
members:
  DM_Description:
    summary: Returns the description of this variant.
  DM_FindComponentVariationByUniqueId:
    summary: Returns the component variation of this variant for the component with that unique ID, or null when the
      variant has none.
    parameters:
      argUniqueId: The component's unique ID in hierarchical path form (sheet symbol IDs, then the component ID, each
        preceded by a backslash), as PCB.IPCB_Component.SourceUniqueId and EDP.IPart.DM_UniqueId on the project's
        flattened document return it.
  DM_Name:
    summary: Returns the name of this variant.
  DM_Project:
    summary: Returns the IProject interface this variant is associated with.
  DM_VariationCount:
    summary: Returns the number of component variations in this variant; use with DM_Variations.
  DM_Variations:
    summary: Returns the indexed component variation for this project. To be used in conjunction with the DM_VariationCount
      method.
