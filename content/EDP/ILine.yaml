# EDP.ILine: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: A straight line segment in the compiled design model, such as one segment of a net's wire.
remarks: >-
  `EDP.INet.DM_Lines` returns one `ILine` per segment: the segments of one wire have the same `DM_SchHandle`, which
  resolves to that `SCH.ISch_Wire`.
members:
  DM_HX:
    summary: This method returns the upper right coordinate of the line.
  DM_HY:
    summary: This method returns the upper right coordinate of the line.
  DM_LX:
    summary: This method returns the lower left coordinate of the line.
  DM_LY:
    summary: This method returns the lower left coordinate of the line.
