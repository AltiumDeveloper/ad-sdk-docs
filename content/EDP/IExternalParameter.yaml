# EDP.IExternalParameter: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The IExternalParameter interface defines the external parameter object
members:
  DM_GetName:
    summary: Returns the Name string of the external parameter interface.
  DM_GetSection:
    summary: Returns the Section string of the external parameter interface.
  DM_GetValue:
    summary: Returns the Value string of the external parameter interface.
  DM_SetValue:
    summary: Sets the new value string for this external parameter.
