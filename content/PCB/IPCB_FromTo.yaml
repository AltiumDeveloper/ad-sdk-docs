# PCB.IPCB_FromTo: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: A from-to on a PCB document, a user-defined connection from one pad of a net to another pad of the same net.
remarks: >-
  The from-to refers to its net and its pads by name: `NetName` is the name of the net, and `FromPad` and `ToPad` are pin
  descriptors as returned by `IPCB_Pad.PinDescriptorString`, that is the component designator, a hyphen and the pad
  name, or `Free-` followed by the pad name for a pad that is not part of a component. `GetNet`, `GetFromPad` and
  `GetToPad` find the objects on the board.


  The from-to's `Identifier` is the net name followed by the two pin descriptors, separated by a colon, in parentheses;
  `DescriptorString` returns `FromTo : ` followed by the identifier.
members:
  FromPad:
    summary: The pin descriptor of the pad at the start of the from-to.
    remarks: Assigning a value only stores the text; `GetFromPad` returns the pad it names.
  GetFromPad:
    summary: Returns the pad named by `FromPad`.
    remarks: >-
      The pad is looked up among the pads of the net returned by `GetNet`; its `IPCB_Pad.PinDescriptorString` must
      equal `FromPad` exactly. Returns null when the net or the pad is not found.
  GetNet:
    summary: Returns the net named by `NetName`.
    remarks: Returns null when the from-to is not on a board or the board has no net of that name.
  GetToPad:
    summary: Returns the pad named by `ToPad`.
    remarks: >-
      The pad is looked up among the pads of the net returned by `GetNet`; its `IPCB_Pad.PinDescriptorString` must
      equal `ToPad` exactly. Returns null when the net or the pad is not found.
  NetName:
    summary: The name of the net the from-to belongs to.
    remarks: Assigning a value only stores the text; `GetNet` returns the net it names.
  RoutedLength:
    summary: The routed length of the from-to, in internal units (10,000 per mil).
    remarks: >-
      The sum of the lengths of the tracks and arcs on signal layers and the heights of the vias that connect the two
      pads. These primitives are found when the connectivity of the net is analysed, and only when both pads are found
      and connected to each other; otherwise the value is 0.
  ToPad:
    summary: The pin descriptor of the pad at the end of the from-to.
    remarks: Assigning a value only stores the text; `GetToPad` returns the pad it names.
