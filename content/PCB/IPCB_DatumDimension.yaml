# PCB.IPCB_DatumDimension: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The IPCB_DatumDimension interface references the dimensioning of a linear distance of a collection of objects,
  relative to a single object. The dimension value is the distance between each reference object and the base object
  measured in the default units. The references may be tracks, arcs, pads, vias, text, fills, polygons or components.
