# PCB.IPCB_RoutingTopologyRule: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: This routing topology rule method specifies the topology of the net. The net compromises a pattern of the
  pin-to-pin connections. A topology is applied to a net for specific reasons, for example to minimise signal
  reflections, daisy chain topology is used.
remarks: "The Topology property sets or returns the topology of the net. The following topologies can be applied:
  Shortest, Horizontal, Vertical, Daisy-Simple, Daisy-Mid Driven, Daisy-Balanced, or Star."
