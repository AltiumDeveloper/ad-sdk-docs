# PCB.IPCB_MechanicalLayer: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: There are 16 general purpose mechanical layers for defining the board layout, placing dimensions on, including
  fabrication details on, or any other mechanical details the design requires.
remarks: >-
  To obtain mechanical layers, you iterate for layers on a PCB document, and once you determine it is a mechanical
  layer, you can wrap the layer as a IPCB_MechanicalLayer interface.


  Note that the Layer stack only stores existing copper based layers, but you can use the `IPCB_LayerStack.LayerObject` property to fetch all layers by using a Layer loop.


  Code snippet
members:
  DisplayInSingleLayerMode:
    summary: This property determines whether the document is displayed in the single layer mode. Set it true to override
      the system's single layer mode setting and the design objects on these enabled single layer mode mechanical layers
      still show up in the single layer mode.
  LinkToSheet:
    summary: This property determines whether this mechanical layer is linked to the sheet on the PCB document or not. Once
      a sheet is linked to the mechanical layer, the sheet is re-sized automatically to fit the objects on the linked
      layer when a zoom command is executed.
  MechLayerEnabled:
    summary: This property determines whether this mechanical layer is enabled or not for the current PCB document. You
      cannot disable the mechanical layers that already have design objects on them.
