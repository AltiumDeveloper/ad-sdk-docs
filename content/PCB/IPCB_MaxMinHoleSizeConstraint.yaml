# PCB.IPCB_MaxMinHoleSizeConstraint: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: A hole size rule (`TRuleKind.eRule_MaxMinHoleSize`) that defines the minimum and maximum hole size of pads and
  vias.
remarks: >-
  The limits are either absolute sizes (`MinLimit` and `MaxLimit`) or percentages (`MinPercent` and `MaxPercent`);
  `AbsoluteValues` selects which pair the rule checks. A new rule checks absolute sizes, with a minimum of 1 mil and a
  maximum of 100 mil.


  The rule checks pads and vias on the multi-layer. Pads without a hole are not checked. For a slot or rectangular
  hole, the width and the height of the hole are checked separately. When the rule checks absolute sizes, back-drilled
  vias are not checked.
members:
  AbsoluteValues:
    summary: Whether the rule checks the absolute limits (`MinLimit` and `MaxLimit`) instead of the percentage limits
      (`MinPercent` and `MaxPercent`).
    remarks: >-
      The default is true. It also selects which limits `DataSummaryString` and `DescriptorString` show.
  MaxLimit:
    summary: The maximum hole size, in internal units (10,000 per mil), checked while `AbsoluteValues` is true.
    remarks: A new rule has 100 mil.
  MaxPercent:
    summary: The maximum hole size as a percentage, checked while `AbsoluteValues` is false.
    remarks: >-
      The percentage is the hole size relative to the via diameter, or to the smaller of the pad's X and Y size. A new
      rule has 80 (percent).
  MinLimit:
    summary: The minimum hole size, in internal units (10,000 per mil), checked while `AbsoluteValues` is true.
    remarks: A new rule has 1 mil.
  MinPercent:
    summary: The minimum hole size as a percentage, checked while `AbsoluteValues` is false.
    remarks: >-
      The percentage is the hole size relative to the via diameter, or to the smaller of the pad's X and Y size. A new
      rule has 20 (percent).
