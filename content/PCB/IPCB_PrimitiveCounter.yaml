# PCB.IPCB_PrimitiveCounter: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: Counts the objects of a PCB document; `IPCB_Board.GetPrimitiveCounter` returns it.
members:
  GetCount:
    summary: Counts the objects of a set of object types.
    parameters:
      argObjectSet: The object types to count.
    seeAlso:
      - PCB.TObjectSet
  GetHoleCount:
    summary: Returns the number of holes of the given hole type on the board.
    parameters:
      argHoleType: The hole shape to count.
  GetObjectCount:
    summary: Returns the number of objects of the given object type.
  GetStringCount:
    summary: Returns the number of text strings on the board.
    remarks: Text objects (`TObjectId.eTextObject`) are counted, except the designator and comment of each component.
