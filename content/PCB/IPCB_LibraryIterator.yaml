# PCB.IPCB_LibraryIterator: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: An iterator that fetches the footprints (`IPCB_LibComponent`) of a PCB library.
remarks: >-
  Create it with `IPCB_Library.LibraryIterator_Create` and destroy it with `IPCB_Library.LibraryIterator_Destroy`. To
  fetch the child objects of a footprint, such as pads and tracks, use a group iterator
  (`IPCB_Group.GroupIterator_Create`).
