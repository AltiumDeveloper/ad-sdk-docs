# PCB.IPCB_PolygonConnectStyleRule: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: A polygon connect style rule (`TRuleKind.eRule_PolygonConnectStyle`) that defines how a polygon pour connects
  to the pads and vias it meets.
remarks: >-
  The connection is a relief connection (copper conductors across an air gap), a direct connection (solid copper) or
  no connection; see `ConnectStyle`. The conductor width, the number of conductors, their angle and the air gap
  describe a relief connection.


  A rule can hold separate settings for through-hole pads, SMD pads and vias, and a polygon pour uses the settings for
  the kind of each pad or via. The properties of this interface read the settings for through-hole pads. Assigning a
  property gives through-hole pads, SMD pads and vias the same settings: those of through-hole pads with the new value.


  A new rule has a relief connection with conductors 10 mil wide, 4 conductors at 90 degrees and an air gap of 10 mil.
members:
  ConnectStyle:
    summary: The style of the connection between the polygon and a pad or via.
    remarks: >-
      `TPlaneConnectStyle.eReliefConnectToPlane` is a relief connection, `TPlaneConnectStyle.eDirectConnectToPlane` a
      connection with solid copper, and `TPlaneConnectStyle.eNoConnect` no connection. A new rule has a relief
      connection.
  PolygonReliefAngle:
    summary: The angle of the conductors of a relief connection.
    remarks: >-
      The values are 0, 45, 90 and 135 degrees (`TPolygonReliefAngle`). A new rule has 90 degrees.
  ReliefAirGap:
    summary: The width of the air gap between a pad or via and the polygon copper in a relief connection, in internal
      units (10,000 per mil).
    remarks: Write-only; `ReliefAirGap_1` reads the value.
  ReliefAirGap_1:
    summary: The width of the air gap between a pad or via and the polygon copper in a relief connection, in internal
      units (10,000 per mil).
    remarks: Read-only; `ReliefAirGap` assigns the value. A new rule has 10 mil.
  ReliefConductorWidth:
    summary: The width of each conductor of a relief connection, in internal units (10,000 per mil).
    remarks: Write-only; `ReliefConductorWidth_1` reads the value.
  ReliefConductorWidth_1:
    summary: The width of each conductor of a relief connection, in internal units (10,000 per mil).
    remarks: Read-only; `ReliefConductorWidth` assigns the value. A new rule has 10 mil.
  ReliefEntries:
    summary: The number of conductors of a relief connection (2 or 4).
    remarks: >-
      Write-only; `ReliefEntries_1` reads the value. Assigning more than 2 changes a `PolygonReliefAngle` of 0 degrees
      to 90 degrees and one of 135 degrees to 45 degrees.
  ReliefEntries_1:
    summary: The number of conductors of a relief connection (2 or 4).
    remarks: Read-only; `ReliefEntries` assigns the value. A new rule has 4.
