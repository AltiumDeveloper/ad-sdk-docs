# PCB.IPCB_RuleMaxSlopeFallingEdge: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The IPCB_RuleMaxSlope_FallingEdge interface specifies the maximum allowable slope on the falling edge of the
  signal. The slope is the time it takes for a signal to fall from the threshold voltage to a valid low voltage.
