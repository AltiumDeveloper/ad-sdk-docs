# PCB.IPCB_Dimension: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The base interface of the dimension objects of a PCB document, which show dimensional details of the board in
  imperial or metric units and can be placed on any layer.
remarks: >-
  Altium Designer has several dimension styles: linear, angular, radial, leader, datum, baseline, center, linear
  diameter and radial diameter dimensions. `IPCB_Dimension` is the base interface of `IPCB_OriginalDimension`,
  `IPCB_LinearDimension`, `IPCB_AngularDimension`, `IPCB_RadialDimension`, `IPCB_LeaderDimension`,
  `IPCB_DatumDimension`, `IPCB_BaselineDimension`, `IPCB_CenterDimension`, `IPCB_LinearDiameterDimension` and
  `IPCB_RadialDiameterDimension`. Original dimensions (`IPCB_OriginalDimension`) are the dimension style of P99SE and
  earlier versions.


  The `DimensionKind` property tells which kind of dimension an object is.


  A dimension is a group whose tracks, arcs and texts are generated from its references and its style properties.
  `SetState_XSizeYSize` regenerates them only when the dimension's location, `X1Location`, `Y1Location`, `Layer`,
  `TextX` or `TextY` has changed since the last regeneration. Moving or rotating the dimension with `MoveByXY` or
  `RotateAroundXY` also marks it for regeneration.


  A dimension, especially a baseline or a leader dimension, has several references. A reference ties the dimension to a
  point on an object it measures; the distance between two reference points is the dimensional length.
members:
  ArrowLength:
    summary: The length of the dimension's arrow lines, in internal units (10,000 per mil).
    remarks: >-
      For linear dimensions with `ArrowPosition` set to `TDimensionArrowPosition.eOutside`, the arrows are drawn
      outside the measured span on lines of this length.
  ArrowLineWidth:
    summary: The line width of the arrowheads, in internal units (10,000 per mil).
    remarks: Linear dimensions also draw their dimension line with this width.
  ArrowPosition:
    summary: Whether the arrowheads are drawn inside or outside the measured span.
  ArrowSize:
    summary: The length of the arrowheads, in internal units (10,000 per mil).
  Bold:
    summary: Whether the dimension text is bold when it uses a TrueType font (`UseTTFonts`).
  DimensionKind:
    summary: The kind of dimension, such as linear, angular or radial.
    remarks: >-
      Each kind of dimension object sets this value when it is created. Read it to find out which derived interface,
      such as `IPCB_LinearDimension` or `IPCB_AngularDimension`, the object implements.
  ExtensionLineWidth:
    summary: The line width of the extension lines, in internal units (10,000 per mil).
  ExtensionOffset:
    summary: How far the extension lines extend beyond the dimension line, in internal units (10,000 per mil).
  ExtensionPickGap:
    summary: The gap between a referenced object and the start of its extension line, in internal units (10,000 per
      mil).
    remarks: >-
      For a pad, via, track or arc the gap is measured from the object's edge: half the pad's larger size, half the
      via's size or half the line width is added to it.
  FontName:
    summary: The name of the TrueType font of the dimension text, used when `UseTTFonts` is true.
  Italic:
    summary: Whether the dimension text is italic when it uses a TrueType font (`UseTTFonts`).
  LineWidth:
    summary: The width of the lines drawn by center and original dimensions, in internal units (10,000 per mil).
  MoveTextByXY:
    summary: Moves the dimension text by an offset, changing `TextX` and `TextY`.
    parameters:
      argX: The horizontal offset, in internal units.
      argY: The vertical offset, in internal units.
  MoveTextToXY:
    summary: Moves the dimension text to a new position, setting `TextX` and `TextY`.
    remarks: For an angular dimension, the radius and the sector of the dimension are recalculated from the new position.
    parameters:
      argX: The X coordinate of the new text position, in internal units.
      argY: The Y coordinate of the new text position, in internal units.
  References:
    summary: The reference at the given index, with its point and anchor.
    parameters:
      argI: The zero-based index of the reference, from 0 to `References_Count` - 1.
  References_Add:
    summary: Adds a reference at the end of the dimension's references.
    remarks: >-
      Does nothing when the dimension already has `PCBConstant.MaxReferenceCount` (200) references. A leader dimension
      also adds a line for each reference after the first, and a datum dimension adds a text and an extension line for
      each reference.
  References_Count:
    summary: The number of references of the dimension.
  References_Delete:
    summary: Detaches the reference at the given index from the object it refers to.
    remarks: >-
      The reference is not removed and `References_Count` does not change: the reference keeps the current coordinates
      of its point but no longer refers to the object. `References_DeleteLast` removes a reference.
    parameters:
      argIndex: The zero-based index of the reference.
  References_DeleteLast:
    summary: Removes the last reference of the dimension, reducing `References_Count` by one.
    remarks: >-
      A leader dimension also deletes the line that belonged to the reference, and a datum dimension deletes the text
      and the extension line that belonged to it.
  References_IndexOf:
    summary: Searches the dimension's references for one that refers to the given primitive.
    parameters:
      argIndex: The index of the first reference to check.
      argP: The primitive to look for.
  References_Validate:
    summary: Checks that each reference still matches a point on the object it refers to, and reattaches the references
      that do not.
    remarks: >-
      References with an anchor of -1 are skipped. A reference whose stored point no longer matches its object, at its
      anchor or at another anchor of the same object, is attached to the object found at the stored point on the board,
      or detached when no object there matches the point. Returns true when no reference had to be reattached.
  ResetPrefixIfNeeded:
    summary: Makes the text prefix of a diameter dimension start with a diameter symbol.
    remarks: >-
      For dimensions of kind `TDimensionKind.eLinearDiameterDimension` or `TDimensionKind.eRadialDiameterDimension`
      the prefix may be replaced by a diameter symbol followed by a space, for example when it is empty. For other
      kinds the prefix is left unchanged.
  RotateAroundXY:
    summary: Rotates the dimension around a point.
    remarks: >-
      When every object the dimension refers to is selected, or the dimension refers to no object, the reference
      points and the text position are rotated as well.
    parameters:
      argX: The X coordinate of the rotation center, in internal units.
      argY: The Y coordinate of the rotation center, in internal units.
      argngle: The rotation angle.
  Size:
    summary: A size used by some dimension kinds, in internal units (10,000 per mil).
    remarks: >-
      A center dimension uses it as the size of its cross, a leader dimension as the size of the circle or square at
      its end, and an original dimension as the distance its end marks extend on each side of the dimension line.
  Style:
    summary: How an original dimension shows the unit of its value.
    remarks: >-
      `TUnitStyle.eNoUnits` shows the value only, `TUnitStyle.eYesUnits` the value with its unit and
      `TUnitStyle.eParenthUnits` the value followed by the unit in parentheses. The value is shown in the board's
      display unit. Other dimension kinds format their text with `TextFormat`, `TextDimensionUnit` and
      `TextPrecision`.
  TextDimensionUnit:
    summary: The unit in which the measured value is shown.
    remarks: >-
      Distances are shown in `TDimensionUnit.eMils`, `TDimensionUnit.eInches`, `TDimensionUnit.eMillimeters` or
      `TDimensionUnit.eCentimeters`; `TDimensionUnit.eAutomaticUnit` uses millimeters when the board's display unit is
      metric and mils otherwise. Angles are shown in radians when the unit is `TDimensionUnit.eRadians` and in degrees
      otherwise.
  TextFont:
    summary: The stroke font of the dimension text, used when `UseTTFonts` is false.
  TextFormat:
    summary: How the measured value is formatted in the dimension text.
    remarks: >-
      For a distance, an empty string shows no value, "10" shows the value only, "10mil" the value followed by the
      unit abbreviation and "10 (mil)" the value followed by the unit in parentheses. For an angle in degrees, "10"
      shows whole degrees, "10*10*" degrees and minutes, and "10*10*10**" degrees, minutes and seconds.
  TextGap:
    summary: The gap kept between the dimension text and the dimension lines, in internal units (10,000 per mil).
  TextHeight:
    summary: The height of the dimension text, in internal units (10,000 per mil).
  TextLineWidth:
    summary: The stroke width of the dimension text, in internal units (10,000 per mil).
  TextPosition:
    summary: Where the dimension text is placed relative to the dimension line.
    remarks: >-
      With `TDimensionTextPosition.eTextManual` the text is not repositioned when the dimension is regenerated; with any
      other value its position and rotation are calculated from the dimension line.
  TextPrecision:
    summary: The number of digits after the decimal point in the measured value.
    remarks: For an angle shown as degrees, minutes and seconds it applies to the seconds.
  TextPrefix:
    summary: Text shown before the measured value.
    remarks: >-
      Assigning a value calls `ResetPrefixIfNeeded`, so linear diameter and radial diameter dimensions may replace the
      assigned prefix with a diameter symbol.
  TextSuffix:
    summary: Text shown after the measured value.
  TextValue:
    summary: The measured value shown in the dimension text.
    remarks: >-
      Linear, angular, radial, datum, baseline and linear diameter dimensions set it to the measured value each time
      their primitives are regenerated, so an assigned value can be overwritten.
  TextX:
    summary: The X coordinate of the dimension text position, in internal units (10,000 per mil).
  TextY:
    summary: The Y coordinate of the dimension text position, in internal units (10,000 per mil).
  UseTTFonts:
    summary: Whether the dimension text uses a TrueType font (`FontName`, `Bold`, `Italic`) instead of the stroke font
      `TextFont`.
  X1Location:
    summary: The X coordinate of the dimension's second point, in internal units (10,000 per mil).
    remarks: >-
      For an original dimension, the measured length is the distance from (`XLocation`, `YLocation`) to
      (`X1Location`, `Y1Location`).
  Y1Location:
    summary: The Y coordinate of the dimension's second point, in internal units (10,000 per mil).
    remarks: >-
      For an original dimension, the measured length is the distance from (`XLocation`, `YLocation`) to
      (`X1Location`, `Y1Location`).
