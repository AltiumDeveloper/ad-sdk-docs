# PCB.IPCB_Contour: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: An outline made of an ordered list of vertices, such as the outline or a hole of a region, or one contour of a
  geometric polygon.
remarks: >-
  A contour is created with `IPCB_ServerInterface.PCBContourFactory`, or obtained from a region with
  `IPCB_Region.GetMainContour` and `IPCB_Region.GetHole`, or from a geometric polygon with
  `IPCB_GeometricPolygon.Contour`.


  A contour returned by `IPCB_GeometricPolygon.Contour` refers to the vertices of that polygon: changing the contour
  changes the polygon. Use `Replicate` for an independent copy.
members:
  AddContour:
    summary: Appends a range of vertices of another contour to the end of this contour.
    remarks: The range includes both ends, so at least one vertex is added.
    parameters:
      argC: The contour whose vertices are appended.
      argStartIndex: The zero-based index of the first vertex of `argC` to append.
      argEndIndex: >-
        The zero-based index of the last vertex of `argC` to append. When it is less than `argStartIndex`, the range
        runs to the last vertex of `argC` and continues from its first vertex.
  AddContour_1:
    summary: Appends all vertices of another contour to the end of this contour.
    parameters:
      argC: The contour whose vertices are appended.
  AddPoint:
    summary: Adds a vertex at the end of the contour.
    parameters:
      argx: The X coordinate of the new vertex, in internal units.
      argy: The Y coordinate of the new vertex, in internal units.
  Area:
    summary: The area enclosed by the contour, in square internal units.
    remarks: >-
      The value is rounded to a whole number and is never negative, whichever direction the vertices run in. A contour
      with fewer than three vertices has an area of 0.
  Clear:
    summary: Removes all vertices from the contour.
  Count:
    summary: The number of vertices in the contour.
    remarks: >-
      Assigning a larger value adds vertices at the end of the contour, assigning a smaller value removes vertices from
      the end. Assign the coordinates of added vertices with `PointX` and `PointY`.
  DeletePoint:
    summary: Removes a vertex from the contour; the vertices after it move down by one position.
    parameters:
      argIndex: The zero-based index of the vertex to remove, from 0 to `Count` - 1.
  EnsureCapacity:
    summary: Reserves storage for at least the given number of vertices, without changing `Count`.
    parameters:
      argValue: The number of vertices to reserve storage for.
  InsertPoint:
    summary: Inserts a vertex into the contour; the vertex at the given position and those after it move up by one
      position.
    parameters:
      argIndex: The zero-based index that the new vertex receives.
      argx: The X coordinate of the new vertex, in internal units.
      argy: The Y coordinate of the new vertex, in internal units.
  PointX:
    summary: The X coordinate of a vertex, in internal units (10,000 per mil).
    remarks: Reading or assigning a vertex of an empty contour raises an error.
    parameters:
      argI: >-
        The zero-based index of the vertex. An index outside 0 to `Count` - 1, including a negative one, is wrapped
        around: an index of `Count` addresses the first vertex, an index of -1 the last.
  PointY:
    summary: The Y coordinate of a vertex, in internal units (10,000 per mil).
    remarks: Reading or assigning a vertex of an empty contour raises an error.
    parameters:
      argI: >-
        The zero-based index of the vertex. An index outside 0 to `Count` - 1, including a negative one, is wrapped
        around: an index of `Count` addresses the first vertex, an index of -1 the last.
  Replicate:
    summary: Returns an independent copy of the contour; changing the copy does not change the original, and the
      reverse.
  Rotate:
    summary: Rotates every vertex of the contour about the origin (0, 0).
    remarks: >-
      The rotated coordinates are rounded to whole internal units, so repeated rotations accumulate rounding errors.
    parameters:
      argngleInDegrees: The rotation angle, in degrees.
  RotateAboutPoint:
    summary: Rotates every vertex of the contour about a given point.
    remarks: >-
      The rotated coordinates are rounded to whole internal units, so repeated rotations accumulate rounding errors.
    parameters:
      argngleInDegrees: The rotation angle, in degrees.
      argx: The X coordinate of the centre of rotation, in internal units.
      argy: The Y coordinate of the centre of rotation, in internal units.
  Translate:
    summary: Moves every vertex of the contour by a given offset.
    parameters:
      argx: The offset added to the X coordinate of every vertex, in internal units.
      argy: The offset added to the Y coordinate of every vertex, in internal units.
