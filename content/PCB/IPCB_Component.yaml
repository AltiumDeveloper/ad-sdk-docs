# PCB.IPCB_Component: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: A component on a PCB document, a footprint from a PCB library (or an integrated library) placed with a designator
  and an optional comment. A footprint can be linked to a schematic component.
remarks: >-
  Components are defined by footprints, which are stored in a PCB library. When a footprint is placed in the workspace,
  it is assigned a designator (and optional comment). It is then referred to as a component. A component is composed of
  primitives (normally tracks, arcs, and pads). The origin in the library editor defines the reference point of a
  footprint.


  The reference point of a component is set by `XLocation` and `YLocation`, inherited from `IPCB_Group`. You can obtain
  the bounding rectangle of the component and calculate its mid point to rotate the component about its center if
  desired.


  `Rotation` rotates the component about its reference point, therefore assigning `Rotation` and calling
  `RotateAroundXY` are equivalent only if the point you pass to `RotateAroundXY` is the reference point of the
  component.


  A component is a group object and therefore composes of child objects such as arcs and tracks. You use a group
  iterator (`GroupIterator_Create`) to fetch the child objects for that component.
members:
  AddAxis:
    summary: Adds a new axis to the component and returns it.
  AutoPosition_NameComment:
    summary: Places the name and the comment of the component at their automatic positions.
    remarks: >-
      A name or comment whose position (`NameAutoPos`, `CommentAutoPos`) is `TTextAutoposition.eAutoPos_Manual` is
      placed at the top left and keeps its manual setting.
  Axis:
    summary: The axis of the component at the given index.
    parameters:
      argI: The zero-based index of the axis, less than `AxisCount`.
  AxisCount:
    summary: The number of axes of the component.
  BoundingRectangleNoNameComment:
    summary: Returns the bounding rectangle of the component without its name and comment texts.
  BoundingRectangleNoNameCommentForSignals:
    summary: Returns the bounding rectangle of the component's tracks, arcs, pads and regions, without its name and
      comment texts.
    remarks: >-
      A pad contributes its shapes on the top and the bottom layer. When the component has none of these primitives,
      the rectangle is a 10 mil square centered on the reference point.
  ChangeAutopositionNameComment:
    summary: Places the name and the comment again at their automatic positions (`NameAutoPos`, `CommentAutoPos`).
    remarks: A name or comment whose position is `TTextAutoposition.eAutoPos_Manual` is left where it is.
  ChangeCommentAutoposition:
    summary: Sets `CommentAutoPos` to the given position and moves the comment text there.
    remarks: >-
      While `CommentOn` is false the position is only stored and the text is not moved. Returns false when the text
      could not be placed, or when the comment is hidden and the position is `TTextAutoposition.eAutoPos_Manual`.
    parameters:
      argValue: The position of the comment text relative to the component.
  ChangeNameAutoposition:
    summary: Sets `NameAutoPos` to the given position and moves the name text there.
    remarks: >-
      While `NameOn` is false the position is only stored and the text is not moved. Returns false when the text could
      not be placed, or when the name is hidden and the position is `TTextAutoposition.eAutoPos_Manual`.
    parameters:
      argValue: The position of the name text relative to the component.
  ChannelOffset:
    summary: The ChannelOffset represents the Channel Offset parameter for the component. A channel offset denotes where the
      component is in a room especially when a room is being copied and a copy is created on the same document. The
      copies of rooms containing components are created based on their offsets.
  ClearAxes:
    summary: Removes all axes from the component.
  Comment:
    summary: The comment text object of the component.
    seeAlso:
      - PCB.IPCB_Text
  CommentAutoPos:
    summary: The position of the comment text relative to the component.
    remarks: Assigning a value does not move the text; `ChangeCommentAutoposition` sets the position and moves the text.
    seeAlso:
      - PCB.TTextAutoposition
  CommentOn:
    summary: Whether the comment text of the component is visible.
  ComponentKind:
    summary: The kind of the component, which decides how it takes part in synchronization, electrical checks and the BOM.
    remarks: >-
      `EDP.TComponentKind.eComponentKind_Standard`: these components possess standard electrical properties, are always
      synchronized and are the type most commonly used on a board.


      `EDP.TComponentKind.eComponentKind_Mechanical`: these components do not have electrical properties and will appear in
      the BOM. They are synchronized if the same components exist on both the schematic and PCB documents. An example is
      a heatsink.


      `EDP.TComponentKind.eComponentKind_Graphical`: these components are not used during synchronization or checked for
      electrical errors. These components are used, for example, when adding company logos to documents.


      `EDP.TComponentKind.eComponentKind_NetTie_BOM`: these components short two or more different nets for routing; they
      appear in the BOM and are maintained during synchronization.


      `EDP.TComponentKind.eComponentKind_NetTie_NoBOM`: these components short two or more different nets for routing; they
      do not appear in the BOM and are maintained during synchronization.
  DefaultPCB3DModel:
    summary: The name of the default PCB 3D model linked to this component.
  EnablePartSwapping:
    summary: The property denotes the part swapping. Components can have multi-parts and in this case, these multi parts can
      be swapped if the EnablePartSwapping is set to true.
  EnablePinSwapping:
    summary: The property denotes the pin swapping for the pins of this component. In this case, these pins can be swapped
      if the EnablePinSwapping is set to true.
  FlipComponent:
    summary: Moves the component from the top layer to the bottom layer, or from the bottom layer to the top layer.
    remarks: A component on any other layer is left unchanged.
  FlippedOnLayer:
    summary: Not supported; reading always returns false, and assigning a value has no effect.
  FootprintDescription:
    summary: The description of the component's footprint.
  Getstate_PadByName:
    summary: Returns the first pad of the component with the given name, or null when the component has no such pad.
    parameters:
      argS: The pad name to look for; the comparison is case-sensitive.
  GroupNum:
    summary: This property is not used internally. Can use for specific purposes such as a tag or an index.
  Height:
    summary: The height of the component, in internal units (10,000 per mil). It is used for the 3D viewer which works out
      the heights of components before displaying components in a 3D view.
  IsBGA:
    summary: Whether the component has been recognized as a ball grid array (BGA) package.
  IsFitted:
    summary: Returns whether the component is fitted in the current variant of the board.
  IsPackageEqual:
    summary: Returns whether the given component has the same package as this component, comparing their primitives.
    remarks: Returns false when the given component is null.
    parameters:
      argComp: The component to compare with.
  IsPackageEqualEx:
    summary: Returns whether the given component has the same package as this component, using the given comparison
      options.
    remarks: Returns false when the given component is null. `IsPackageEqual` compares with no options.
    parameters:
      argComp: The component to compare with.
      argOptions: The comparison options.
    seeAlso:
      - PCB.TPackageCompareOption
  LoadCompFromLibrary:
    summary: Reloads the component's primitives from the library footprint named by `Pattern`.
    remarks: >-
      Returns true when it succeeds.


      When `Pattern` is a plain footprint name, the footprint is read from the library file in
      `SourceFootprintLibrary`; when it cannot be loaded from there, the open library documents are searched. The
      component keeps its location, layer and rotation. It takes `SourceFootprintLibrary`, `FootprintDescription`,
      `DefaultPCB3DModel`, `VaultGUID`, `ItemGUID`, `ItemRevisionGUID` and `ComponentKind` from the library footprint,
      and `Height` when the footprint's height is not 0.
  LoadFromLibrary:
    summary: Loads the component's primitives from the library footprint described by a parameter string.
    remarks: >-
      Returns true when it succeeds.


      The SDK examples create a component with `IPCB_ServerInterface.PCBObjectFactory`, assign its `Board`, call this
      method with `FileName=<library path>|Footprint=<footprint name>`, then set its layer and location and add it to
      the board with `IPCB_Board.AddPCBObject`.
    parameters:
      argParams: The parameters that identify the library and the footprint, as `Name=Value` pairs separated by `|`, for
        example `FileName=<library path>|Footprint=<footprint name>`.
  LockStrings:
    summary: Whether the component's name and comment texts are locked, so that they cannot be moved independently of the
      component.
  ModelHash:
    summary: A hash of the 3D models in the component's bodies.
    remarks: >-
      The hash covers each model with its origin, rotations and vertical offset. It is an empty string when no
      component body of the component has a 3D model.
  Name:
    summary: The designator text object of the component.
    seeAlso:
      - PCB.IPCB_Text
  NameAutoPos:
    summary: The position of the name (designator) text relative to the component.
    remarks: Assigning a value does not move the text; `ChangeNameAutoposition` sets the position and moves the text.
    seeAlso:
      - PCB.TTextAutoposition
  NameOn:
    summary: Whether the name (designator) text of the component is visible.
  PackageSpecificHash:
    summary: A hash value computed from the component's primitives.
  Pattern:
    summary: The name of the component's footprint.
    remarks: Leading and trailing spaces are removed from an assigned value.
  Rebuild:
    summary: Reloads the component from the library footprint named by `Pattern` and applies the component's rotation
      again.
  ResetDisplacement:
    summary: Resets the component's displacement to the identity transformation.
  RotateAroundXY:
    summary: Rotates the component about a point.
    remarks: >-
      The component's primitives, its reference point (`XLocation`, `YLocation`) and its `Rotation` change by the
      rotation. To rotate the component in place, pass its reference point, or assign `Rotation`.
    parameters:
      argX: The X coordinate of the point to rotate about, in internal units (10,000 per mil).
      argY: The Y coordinate of the point to rotate about, in internal units (10,000 per mil).
      argngle: The rotation angle, in degrees.
    seeAlso:
      - PCB.IPCB_Component.Rotation
  Rotation:
    summary: The angle of the component with respect to the horizontal axis, in degrees.
    remarks: Assigning a different value rotates the component, with its primitives, about its reference point
      (`XLocation`, `YLocation`) by the difference.
  SaveModelToFile:
    summary: Saves the component's 3D model to a file.
    remarks: >-
      Whether the model is saved as a part depends on a PCB editor setting; use `SaveModelToFileAsPart` to always save
      it as a part.


      The SDK examples load a footprint with `LoadFromLibrary`, add the component to a board and call this method with
      a `.stp` path to write a STEP file.
    parameters:
      argFullPath: The full path of the file to write.
  SaveModelToFileAsPart:
    summary: Saves the component's 3D model to a file as a part.
    parameters:
      argFullPath: The full path of the file to write.
  SaveModelToOccDoc:
    summary: Writes the component's 3D model into the given document.
    parameters:
      argOccDoc: The document that receives the model.
  SourceCompDesignItemID:
    summary: The design item ID of the source component; `SourceLibReference` reads and assigns the same value.
  SourceComponentLibrary:
    summary: "This source library field denotes the integrated library where the PCB component comes from. Note: When a
      schematic is transferred to a blank PCB using the Update command, the source reference links for each PCB
      footprint is populated with source library path names."
  SourceDescription:
    summary: This property can include a descriptive account of the reference link to a source component or a device name.
  SourceDesignator:
    summary: This property represents the current designator of the source component from the corresponding schematic.
  SourceFootprintLibrary:
    summary: The library the component's footprint comes from.
    remarks: >-
      Footprints are stored in PCB library files or integrated libraries, which can be edited using the PCB Library
      Editor to create new footprints or edit existing ones. `LoadCompFromLibrary` reads the footprint from this library
      when `Pattern` is a plain footprint name.
  SourceHierarchicalPath:
    summary: This property uniquely identifies the source reference path to the PCB component. The path can be multi-level
      depending on whether it is a multi channel (sheet symbols) or a normal design (schematic sheets).
  SourceLibReference:
    summary: The same value as `SourceCompDesignItemID`; reading and assigning this property reads and assigns
      `SourceCompDesignItemID`.
  SourceUniqueId:
    summary: Unique IDs (UIDs) are used to match each schematic component to the corresponding PCB component.
    remarks: The Unique Identifier (UID) is a system generated value that uniquely identifies the source component.
