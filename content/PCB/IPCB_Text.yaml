# PCB.IPCB_Text: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: "Text strings can be placed on any layer with any height. There are two classes of text strings: Free text
  strings and component text (designators and comments). Free text strings are standalone strings which could be used as
  descriptors or labels for any application on the workspace. There are two component text objects- designator attribute
  and comment attribute. Each component must have a unique designator and thus designators are not globally editable.
  The comment attribute is globally editable though."
remarks: >-
  The PCB editor includes special strings which are interpreted when output (printing, plotting or generating gerber
  files) is generated. For example, the string .PRINT_DATE will be replaced by the current date when output is
  generated.


  Text objects are not inherited from the IPCB_group interface, therefore fetching child objects within a text object is
  not possible.


  Text objects are rectangular primitives with rectangular coordinates properties and the rotation property.


  Text objects can be converted into a series of strokes using the ConvertToStrokeArray method from the IPCB_Text
  interface.
members:
  Bold:
    summary: This property sets or gets the bold property of the PCB string true Type text on a PCB document.
    remarks: Once the UseTTFonts property is enabled, you can use the Bold, Italic, FontName, Inverted, InvertedTTTextBorder
      and TTTextOutline properties.
  ConvertedString:
    summary: This property converts a special string into a text based string. The PCB editor includes special strings which
      are interpreted when output (printing, plotting or generating gerber files) is generated. For example, the string
      .PRINT_DATE will be replaced by the current date when the ConvertedString method is invoked.
    remarks: |-
      The available special strings are;

      .PRINT_TIME

      .PRINT_SCALE

      .LAYER_NAME

      .PCB_FILE_NAME

      .PCB_FILE_NAME_NO_PATH

      .PLOT_FILE_NAME

      .ARC_COUNT

      .COMPONENT_COUNT

      .FILL_COUNT

      .HOLE_COUNT

      .NET_COUNT

      .PAD_COUNT

      .STRING_COUNT

      .TRACK_COUNT

      .VIA_COUNT

      .DESIGNATOR

      .COMMENT

      .LEGEND

      .NET_NAMES_ON_LAYER
    seeAlso:
      - PCB.IPCB_SpecialStringConverter
  ConvertToStrokeArray:
    summary: Text objects can be converted into a series of strokes using the ConvertToStrokeArray method. This is useful
      for rending text objects as standalone line objects to be used in external programs such as 3D modelling
      applications.
  FontID:
    summary: The FontID property denotes which Font the text object is using. The property is supported by GetState_FontID
      and SetState_FontID methods.
    remarks: >-
      The TFontID type defines the font ID for a text object. It is the index to an entry in the font table in the PCB
      editor. Each font used in the PCB editor has its own FontID.


      Thus when a new font is used (through a Change Font dialog of a Change object dialog), a new FontID is added to
      the table in the PCB editor. The FontID value can be extracted from PCB text objects.
  FontName:
    summary: This property sets or gets the FontName property of the PCB string true Type text on a PCB document. For
      example one of the true Type font strings could be 'Arial', 'Arial Narrow', 'Courier New' and 'Verdana'.
    remarks: >-
      Once the UseTTFonts property is enabled, you can use the Bold, Italic, FontName, Inverted, InvertedTTTextBorder
      and TTTextOutline properties.


      // notify that the pcb object is going to be modified


      PCBServer.SendMessageToRobots(TextObj.I_ObjectAddress, c_Broadcast, PCBM_BeginModify, c_NoEventData);


      // inverts the text object and a text boundary is created around the text


      // The Inverted and InvertedTTTextBorder properties are useful for situations


