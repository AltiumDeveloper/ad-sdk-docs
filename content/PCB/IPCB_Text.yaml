  GetDesignatorDisplayString:
    summary: This method retrieves the designator string directly from a text object.
  InAutoDimension:
    summary: This method tests whether this text object is used for the auto dimension object or not.
  Inverted:
    summary: This property sets or gets the Inverted property of the PCB string true Type text on a PCB document.
    remarks: >-
      The Inverted property inverts the text object and a text boundary is created around the text. The Inverted and
      InvertedTTTextBorder properties are useful for situations if IPCB_Text object is to be placed on a copper region
      and create a cutout in the region. The color of the inverted border is the layer color and the text color itself
      is black.


      Once the UseTTFonts property is enabled, you can use the Bold, Italic, FontName, Inverted, InvertedTTTextBorder
      and TTTextOutline properties.
    seeAlso:
      - PCB.IPCB_Text.InvertedTTTextBorder
  InvertedTTTextBorder:
    summary: This property sets or gets the InvertedTTTextBorder property of the PCB string true Type text on a PCB document.
    remarks: >-
      The Inverted property inverts the text object and a text boundary is created around the text. The Inverted and
      InvertedTTTextBorder properties are useful for situations if IPCB_Text object is to be placed on a copper region
      and create a cutout in the region. The color of the inverted border is the layer color and the text color itself
      is black.


      Once the UseTTFonts property is enabled, you can use the Bold , Italic , FontName , Inverted ,
      InvertedTTTextBorder and TTTextOutline properties.
    seeAlso:
      - PCB.IPCB_Text.Inverted
  IsComment:
    summary: This method tests whether this text object is a comment object associated with a component object for example.
  IsDesignator:
    summary: This method tests whether this text object is a designator for a object, for example whether a pad object has a
      designator.
  Italic:
    summary: The Italic property sets or gets the italic property of the PCB string true Type text on a PCB document.
    remarks: Once the UseTTFonts property is enabled, you can use the Bold, Italic, FontName, Inverted, InvertedTTTextBorder
      and TTTextOutline properties.
  Mirror:
    summary: This method sets the Mirror attribute which represents the mirrored state of this Text Object on a PCB
      document. This property supports GetState_Mirror and SetState_Mirror methods.
  RotationHandle:
    summary: This method returns the rotation handle of the text object as a record of X and Y coordinates (TPoint).
  Size:
    summary: The Size property sets the height of the text. This property is supported by GetState_Size and SetState_Size
      methods.
  Text:
    summary: The Text property contains the text for the Text object.
    remarks: Note, the PCB editor includes special strings which are interpreted when output (printing, plotting or
      generating gerber files) is generated. For example, the string .PRINT_DATE will be replaced by the current date
      when output is generated.
  UnderlyingString:
    summary: This UnderlyingString property is equivalent to the Text property.
    remarks: Note, the PCB editor includes special strings which are interpreted when output (printing, plotting or
      generating gerber files) is generated. For example, the string .PRINT_DATE will be replaced by the current date
      when output is generated.
  UseTTFonts:
    summary: This property toggles the true Type font property for the PCB string text on a PCB document.
    remarks: >-
      Once the UseTTFonts property is enabled, you can use the Bold, Italic, FontName, Inverted, InvertedTTTextBorder
      and TTTextOutline properties.


      // notify that the pcb object is going to be modified


      PCBServer.SendMessageToRobots(TextObj.I_ObjectAddress, c_Broadcast, PCBM_BeginModify, c_NoEventData);


      // Can use Open true Type Fonts...


      Board.AddPCBObject(TextObj);


      // notify that the pcb object has been modified


      PCBServer.SendMessageToRobots(TextObj.I_ObjectAddress, c_Broadcast, PCBM_EndModify , c_NoEventData);


      PCBServer.SendMessageToRobots(Board.I_ObjectAddress, c_Broadcast,
      PCBM_BoardRegisteration,TextObj.I_ObjectAddress);
  Width:
    summary: This method sets the Width attribute which represents the width used for this Text Object on a PCB document.
