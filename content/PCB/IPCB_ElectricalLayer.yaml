# PCB.IPCB_ElectricalLayer: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: A copper layer of a board's layer stack, the common base of `IPCB_SignalLayer` and `IPCB_InternalPlane`.
members:
  CopperThickness:
    summary: The thickness of the copper on the layer, in internal units (10,000 per mil).
    remarks: >-
      A new electrical layer has a copper thickness of 14,000 internal units (1.4 mil). Convert the value with
      `EDP.Utils.CoordToMils` or `EDP.Utils.CoordToMMs`.
