# PCB.IPCB_GroupIterator: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: An iterator that fetches the child objects of a group object, such as the pads and tracks of a component.
remarks: >-
  Group objects include components, footprints in a PCB library (`IPCB_LibComponent`), polygons, split planes, nets,
  dimensions, coordinates and the board outline. Create the iterator with `IPCB_Group.GroupIterator_Create` on the
  group object and destroy it with `IPCB_Group.GroupIterator_Destroy` on the same object. The filters and the walk are
  inherited from `IPCB_AbstractIterator`; a new group iterator fetches the children of every kind on every layer.


  To fetch the child objects of the components of a board, fetch the components with an `IPCB_BoardIterator`, create
  a group iterator for each component, and destroy it when its child objects are done. Destroy the board iterator
  when the walk over the board is finished.
