# PCB.IPCB_Arc: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: A circular arc on a PCB document, a track segment of width `LineWidth` around the centre (`CenterX`,
  `CenterY`) with `Radius`, from `StartAngle` to `EndAngle`.
remarks: >-
  Arcs can be placed on any layer. On a signal layer an arc can be electrically connected to tracks; arcs are also used,
  for example, to outline component shapes.


  The angles are in degrees, and the arc runs counter-clockwise from `StartAngle` to `EndAngle`. A `StartAngle` of 0
  and an `EndAngle` of 360 make a full circle. The start and end points (`StartX`, `StartY`, `EndX`, `EndY`) are not
  stored: they are calculated from the centre, the radius and the angles each time they are read.
members:
  CenterX:
    summary: The X coordinate of the arc's centre, in internal units (10,000 per mil).
  CenterY:
    summary: The Y coordinate of the arc's centre, in internal units (10,000 per mil).
  EndAngle:
    summary: The angle of the arc's end point, in degrees.
  EndX:
    summary: The X coordinate of the arc's end point, in internal units (10,000 per mil).
    remarks: Calculated on every read as `CenterX` + `Radius` × cos(`EndAngle`), rounded to an integer.
  EndY:
    summary: The Y coordinate of the arc's end point, in internal units (10,000 per mil).
    remarks: Calculated on every read as `CenterY` + `Radius` × sin(`EndAngle`), rounded to an integer.
  LineWidth:
    summary: The stroke width of the arc, in internal units (10,000 per mil).
  Radius:
    summary: The radius of the arc, in internal units (10,000 per mil).
  RotateAroundXY:
    summary: Rotates the arc about a point by an angle.
    remarks: >-
      The centre of the arc is rotated about the point, and the angle is added to both `StartAngle` and `EndAngle`. To
      rotate the arc without moving it, pass its own centre (`CenterX`, `CenterY`) as the point.
    parameters:
      argX: The X coordinate of the point to rotate about, in internal units (10,000 per mil).
      argY: The Y coordinate of the point to rotate about, in internal units (10,000 per mil).
      argngle: The rotation angle, in degrees.
  StartAngle:
    summary: The angle of the arc's start point, in degrees.
  StartX:
    summary: The X coordinate of the arc's start point, in internal units (10,000 per mil).
    remarks: Calculated on every read as `CenterX` + `Radius` × cos(`StartAngle`), rounded to an integer.
  StartY:
    summary: The Y coordinate of the arc's start point, in internal units (10,000 per mil).
    remarks: Calculated on every read as `CenterY` + `Radius` × sin(`StartAngle`), rounded to an integer.
  StrictHitTest:
    summary: Whether a point lies on the arc.
    remarks: >-
      Returns false when the arc does not belong to a board. Otherwise it returns true when the point is inside the
      arc's bounding rectangle and a track 20 internal units (0.002 mil) wide placed at the point touches the arc, and
      also when the point is exactly the arc's centre, its start point, its end point or the middle point of the arc.
    parameters:
      argHitX: The X coordinate of the point, in internal units (10,000 per mil).
      argHitY: The Y coordinate of the point, in internal units (10,000 per mil).
