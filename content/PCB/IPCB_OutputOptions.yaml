# PCB.IPCB_OutputOptions: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The output settings of a PCB document, such as drill drawing symbols, pad master layers and the plotted
  layers, returned by `IPCB_Board.OutputOptions`.
remarks: >-
  The interface extends `IPCB_AbstractOptions`. The settings form two groups: general options (drill symbols, pad
  master layers, vias in the solder mask and unconnected pads) and layer options (`PlotLayer`, `FlipLayer` and the
  inclusion of mechanical layers with all plots). Each group can be written to and read from a parameter string.


  For output options, `Import_FromParameters` and `Export_ToParameters` handle both groups;
  `Import_FromParameters_Version3` and `Export_ToParameters_Version3` handle the general options and the layer
  options in the version 3 layer numbering.
members:
  BottomLayerOnPadMaster:
    summary: Whether bottom layer objects are included on the pad master plot.
    remarks: The default is true. Saved as the `BottomLayerOnPadMaster` parameter.
  DrillDrawSymbolSize:
    summary: The size of the symbols on the drill drawing, in internal units (10,000 per mil).
    remarks: The default is 50 mil. Saved as the `DrillDrawSymbolSize` parameter.
  DrillGuideHoleSize:
    summary: The hole size used on the drill guide, in internal units (10,000 per mil).
    remarks: The default is 30 mil. Saved as the `DrillGuideHoleSize` parameter.
  DrillSymbolKind:
    summary: How hole sizes are marked on the drill drawing, with graphic symbols (`TDrillSymbol.eSymbols`), numbers
      (`TDrillSymbol.eNumbers`) or letters (`TDrillSymbol.eLetters`).
    remarks: The default is `TDrillSymbol.eSymbols`. Saved as the integer `DrillSymbolKind` parameter.
  Export_ToParameters_GeneralOptions:
    summary: Writes the general output settings to a parameter string.
    remarks: >-
      Writes `Record=OutputOptions` and the parameters `DrillGuideHoleSize`, `DrillDrawSymbolSize`, `DrillSymbolKind`
      (as an integer), `MultiLayerOnPadMaster`, `TopLayerOnPadMaster`, `BottomLayerOnPadMaster`,
      `IncludeViasInSolderMask` and `IncludeUnconnectedPads`. The layer settings are not written: use
      `Export_ToParameters_LayerOptions`.
    parameters:
      argParameters: The parameter string that receives the settings.
  Export_ToParameters_LayerOptions:
    summary: Writes the layer settings to a parameter string.
    remarks: >-
      Writes `IncludeMech1WithAllPlots` to `IncludeMech16WithAllPlots`, the `PlotLayers.Set` and `FlipLayers.Set`
      parameters, and the `PlotLayers` (`PlotLayer`) and `FlipLayers` (`FlipLayer`) parameters: strings with one
      character per plot layer from `TV6_PlotLayer.eV6_TopLayerPlot` to `TV6_PlotLayer.eV6_BottomPadMasterPlot`, `1`
      for a set layer and `0` for one that is not set.
    parameters:
      argParameters: The parameter string that receives the settings.
  Export_ToParameters_LayerOptions_Version3:
    summary: Writes the layer settings to a parameter string in the version 3 layer numbering.
    remarks: Writes `IncludeMech1WithAllPlots` to `IncludeMech4WithAllPlots` and the `PlotLayers` and `FlipLayers`
      strings, with one character for each plot layer that has a version 3 equivalent; other layers are left out.
    parameters:
      argParameters: The parameter string that receives the settings.
  FlipLayer:
    summary: Whether a plot layer is mirrored in the output.
    remarks: Saved for all plot layers as the `FlipLayers.Set` and `FlipLayers` parameters.
    parameters:
      argPL: The plot layer.
  Import_FromParameters_GeneralOptions:
    summary: Reads the general output settings from a parameter string.
    remarks: Reads the parameters that `Export_ToParameters_GeneralOptions` writes; the layer settings are read by
      `Import_FromParameters_LayerOptions`.
    parameters:
      argDisplayUnit: The unit used to read the coordinate values `DrillGuideHoleSize` and `DrillDrawSymbolSize`.
      argParameters: The parameter string to read.
  Import_FromParameters_LayerOptions:
    summary: Reads the layer settings from a parameter string.
    remarks: >-
      Reads the parameters that `Export_ToParameters_LayerOptions` writes. For each of `PlotLayer` and `FlipLayer`,
      the `PlotLayers.Set` or `FlipLayers.Set` parameter is used when present; otherwise the `PlotLayers` or
      `FlipLayers` string is read, one character per plot layer, and layers beyond the end of the string keep their
      current value. When neither parameter is present, the layer selection is not changed.
    parameters:
      argParameters: The parameter string to read.
  Import_FromParameters_LayerOptions_Version3:
    summary: Reads the layer settings from a parameter string that uses the version 3 layer numbering.
    remarks: Reads `IncludeMech1WithAllPlots` to `IncludeMech4WithAllPlots` and the `PlotLayers` and `FlipLayers`
      strings, and converts each version 3 plot layer to the corresponding current plot layer. Plot layers that have no
      version 3 equivalent are not changed.
    parameters:
      argParameters: The parameter string to read.
  IncludeUnconnectedPads:
    summary: Whether pads that are not connected are included in the output.
    remarks: The default is true. Saved as the `IncludeUnconnectedPads` parameter.
  IncludeViasInSolderMask:
    summary: Whether vias are included in the solder mask output.
    remarks: The default is true. Saved as the `IncludeViasInSolderMask` parameter.
  MultiLayerOnPadMaster:
    summary: Whether multi-layer objects are included on the pad master plot.
    remarks: The default is true. Saved as the `MultiLayerOnPadMaster` parameter.
  PlotLayer:
    summary: Whether a plot layer is included in the output.
    remarks: Saved for all plot layers as the `PlotLayers.Set` and `PlotLayers` parameters.
    parameters:
      argPL: The plot layer.
  TopLayerOnPadMaster:
    summary: Whether top layer objects are included on the pad master plot.
    remarks: The default is true. Saved as the `TopLayerOnPadMaster` parameter.
