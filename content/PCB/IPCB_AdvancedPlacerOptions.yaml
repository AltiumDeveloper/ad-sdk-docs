# PCB.IPCB_AdvancedPlacerOptions: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The automatic component placement settings of a PCB document, returned by `IPCB_Board.PlacerOptions`.
remarks: >-
  The interface extends `IPCB_AbstractOptions`. `Export_ToParameters` and `Export_ToParameters_Version3` write
  `Record=AdvancedPlacerOptions` and one parameter per setting, named after its property; `Import_FromParameters` and
  `Import_FromParameters_Version3` read the same parameters.
members:
  PlaceByPassNet1:
    remarks: Newly created options start with an empty string. Saved as the `PlaceByPassNet1` parameter.
  PlaceByPassNet2:
    remarks: Newly created options start with an empty string. Saved as the `PlaceByPassNet2` parameter.
  PlaceLargeClear:
    summary: The clearance kept around components with 14 or more pads when components are shoved apart, in internal
      units (10,000 per mil).
    remarks: Components with fewer pads use `PlaceSmallClear`. Newly created options start with 50 mil. Saved as the
      `PlaceLargeClear` parameter.
  PlaceSmallClear:
    summary: The clearance kept around components with fewer than 14 pads when components are shoved apart, in
      internal units (10,000 per mil).
    remarks: Components with 14 or more pads use `PlaceLargeClear`. Newly created options start with 20 mil. Saved as
      the `PlaceSmallClear` parameter.
  PlaceUseAdvancedPlace:
    remarks: Newly created options start with true. Saved as the `PlaceUseAdvancedPlace` parameter.
  PlaceUseGrouping:
    remarks: Newly created options start with true. Saved as the `PlaceUseGrouping` parameter.
  PlaceUseLayerSwap:
    remarks: Newly created options start with false. Saved as the `PlaceUseLayerSwap` parameter.
  PlaceUseRotation:
    remarks: Newly created options start with true. Saved as the `PlaceUseRotation` parameter.
