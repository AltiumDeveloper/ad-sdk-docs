# PCB.IPCB_Pad: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: A pad, the connection point of a component pin and of signal tracks, either on a single layer or multi-layer.
remarks: >-
  On a multi-layer pad, the shape and size on the top, middle and bottom layers can be assigned independently to
  define a pad stack. Surface mount components and edge connectors have single-layer pads on the top or bottom layer.


  A pad is defined in one of three modes (`Mode`): simple, top-middle-bottom, or full stack, which allows different
  sizes and shapes on all signal layers. The corner radius of rounded rectangular pads is given by `IPCB_Pad2`.
members:
  BotShape:
    summary: The shape of the pad on the bottom layer of a top-middle-bottom stack.
    remarks: Assigning a value has no effect while `Mode` is `TPadMode.ePadMode_Simple`.
    seeAlso:
      - PCB.TShape
  BotXSize:
    summary: The X size of the pad on the bottom layer of a top-middle-bottom stack.
    remarks: Assigning a value has no effect while `Mode` is `TPadMode.ePadMode_Simple`.
  BotYSize:
    summary: The Y size of the pad on the bottom layer of a top-middle-bottom stack.
    remarks: Assigning a value has no effect while `Mode` is `TPadMode.ePadMode_Simple`.
  BoundingRectangleOnLayer:
    summary: Returns the bounding rectangle of the pad on the given layer.
  Cache:
    summary: The pad's cache of values derived from design rules, such as plane connection style, power plane clearance,
      relief settings and solder and paste mask expansion, each with its own validity state.
    remarks: >-
      Assigning a cache does not change the pad's tenting settings or whether its paste mask is enabled; they keep
      their previous values.


      To change the cache, read `Cache`, change a field (for example set `SolderMaskExpansionValid` to
      `TCacheState.eCacheManual` and `UseSeparateExpansions` to true) and assign it back.
  ClearStackSizeAndShapes:
    summary: Removes the per-layer sizes, shapes, corner radii and offsets stored for the pad.
  DefinitionLayerIterator:
    summary: Returns an iterator over the layers for which the pad has a size, shape or corner radius stored.
  DrillType:
    summary: The method used to drill the pad's hole.
    remarks: This attribute is used by the manufacturing output files such as the CAM files.
  HoleNegativeTolerance:
    summary: The negative tolerance of the pad's hole size, in internal units (10,000 per mil).
    remarks: A negative value is stored as its absolute value. Setting the pad's `Layer` to any layer other than
      `TV6_Layer.eV6_MultiLayer` resets both hole tolerances to `int.MaxValue`.
  HolePositiveTolerance:
    summary: The positive tolerance of the pad's hole size, in internal units (10,000 per mil).
    remarks: A negative value is stored as its absolute value. Setting the pad's `Layer` to any layer other than
      `TV6_Layer.eV6_MultiLayer` resets both hole tolerances to `int.MaxValue`.
  HoleRotation:
    summary: The rotation of the hole within the pad, which applies to square and slotted holes.
  HoleSize:
    summary: The size of the pad's hole, through which component pins or wires are passed and soldered in place, in
      internal units (10,000 per mil).
  HoleType:
    summary: The shape of the pad's hole.
    remarks: There are three hole types - Round Hole, Square Hole and Slotted Hole.
    seeAlso:
      - PCB.TExtendedHoleType
  HoleWidth:
    summary: The width of the pad's hole, in internal units (10,000 per mil), used by square and slotted holes.
    remarks: For a slotted hole, and for a square hole when `HoleWidth` is not 0, the hole's size in X is `HoleWidth`
      and its size in Y is `HoleSize`; otherwise both are `HoleSize`.
  InvalidateCache:
    summary: Marks the pad's cached design rule values as out of date.
    remarks: The pad's calculated sizes and shapes are marked out of date as well. `UpdateCache` recalculates the cached
      values.
  InvalidateSizeShape:
    summary: Marks the pad's calculated sizes and shapes as out of date.
    remarks: They are recalculated by `ValidateSizeShape`, which reading `XSizeOnLayer`, `YSizeOnLayer`,
      `ShapeOnLayer` or `IsPadStack` also does.
  IsConnectedToPlane:
    summary: Whether the pad is connected to the internal plane on the given layer.
    remarks: Returns false for a layer that is not an internal plane layer, and while the pad's plane connections have
      not been calculated (`PlanesValid` of `Cache` is `TCacheState.eCacheInvalid`). Assigning a value for a layer that
      is not an internal plane layer does nothing.
  IsPadStack:
    summary: Returns whether the pad has different sizes or shapes on its layers.
    remarks: >-
      Returns false when `Mode` is `TPadMode.ePadMode_Simple` and true when it is `TPadMode.ePadMode_ExternalStack`.
      For `TPadMode.ePadMode_LocalStack` it returns true only for a multi-layer pad whose top, middle and bottom
      layers differ in shape, X size or Y size. The pad's calculated sizes and shapes are brought up to date first.
      Use this method before you change the properties of a pad stack.
    seeAlso:
      - PCB.TPadMode
  IsSurfaceMount:
    summary: Returns whether the pad is a surface mount pad.
    remarks: Returns true when the pad is on a signal layer (not `TV6_Layer.eV6_MultiLayer`) and either its hole has a
      size of 0 or `Mode` is `TPadMode.ePadMode_Simple`.
  IsVirtualPin:
    summary: Returns whether the pad is a virtual pin.
    remarks: Returns true when the pad's largest X size and largest Y size on its signal layers are both 1 internal
      unit.
  JumperID:
    summary: The jumper identifier of the pad; 0 means the pad is not part of a jumper.
    remarks: When connectivity is analysed, pads of the same component that have the same non-zero `JumperID` are
      treated as joined by a jumper.
  MidShape:
    summary: The shape of the pad on the middle layers of a top-middle-bottom stack.
    remarks: Assigning a value has no effect while `Mode` is `TPadMode.ePadMode_Simple`.
    seeAlso:
      - PCB.TShape
  MidXSize:
    summary: The X size of the pad on the middle layers of a top-middle-bottom stack.
    remarks: Assigning a value has no effect while `Mode` is `TPadMode.ePadMode_Simple`.
  MidYSize:
    summary: The Y size of the pad on the middle layers of a top-middle-bottom stack.
    remarks: Assigning a value has no effect while `Mode` is `TPadMode.ePadMode_Simple`.
  Mode:
    summary: The kind of pad stack; a simple pad, a top-middle-bottom stack, or a full stack.
    remarks: >-
      With `TPadMode.ePadMode_Simple`, the size and shape of the pad are `TopXSize`, `TopYSize` and `TopShape`.


      With `TPadMode.ePadMode_LocalStack` (top-middle-bottom), they are the top, middle and bottom properties
      (`TopXSize`, `MidXSize`, `BotXSize` and so on).


      With `TPadMode.ePadMode_ExternalStack` (full stack), they are `XStackSizeOnLayer`, `YStackSizeOnLayer` and
      `StackShapeOnLayer`.
    seeAlso:
      - PCB.TPadMode
      - PCB.IPCB_Pad.IsPadStack
  Name:
    summary: The designator of the pad.
  OwnerPart_ID:
    summary: The identifier of the component part that owns the pad, used for gate and pin swapping.
  PinDescriptorString:
    summary: This property obtains the description of the pin which represents the pad of a component.
    remarks: >-
      The value is the designator of the pad's component, a hyphen and the pad's `Name`; for a pad that is not part of a
      component it is `Free-` followed by the pad's `Name`. `Identifier` returns the same value.
  PlaneConnectionStyleForLayer:
    summary: Returns how the pad connects to the given internal plane layer.
    remarks: >-
      The style of the connection comes from the applicable Power Plane Connect Style design rule:
      `TPlaneConnectionStyle.ePlaneReliefConnect` (a thermal relief connection) or
      `TPlaneConnectionStyle.ePlaneDirectConnect` (solid copper).


      The method returns `TPlaneConnectionStyle.ePlaneNoConnect` when the layer is not an internal plane layer, when
      the pad is not on `TV6_Layer.eV6_MultiLayer`, when the pad has no net, or when the pad is not connected to the
      plane on that layer.
    seeAlso:
      - PCB.TPlaneConnectionStyle
  Plated:
    summary: Whether the pad is plated.
  RotateAroundXY:
    summary: Rotates the pad about a point.
    remarks: To rotate the pad without moving it, pass its own location (`XLocation`, `YLocation`) as the point, or use
      the `Rotation` property.
    parameters:
      argX: The X coordinate of the point to rotate about, in internal units (10,000 per mil).
      argY: The Y coordinate of the point to rotate about, in internal units (10,000 per mil).
      argngle: The rotation angle, in degrees.
  Rotation:
    summary: The rotation of the pad, in degrees.
    remarks: Assigning a new value rotates the pad about its location by the difference between the new and the old
      angle. 0 and 360 are treated as the same angle.
  ShapeOnLayer:
    summary: This property determines what shape the pad is on this specified layer.
    remarks: On an internal plane layer where the pad's hole straddles planes, returns `TShape.eRounded`.
    seeAlso:
      - PCB.TShape
  SolderMaskExpansionFromHoleEdge:
    summary: Whether the pad's solder mask expansion is measured from the edge of the hole instead of the edge of the
      copper.
    remarks: The setting applies only to a multi-layer pad whose solder mask expansion is set manually; when the
      expansion comes from the design rules, the applicable rule decides. `SolderMaskExpansionFromHoleEdgeWithRule`
      returns the setting that applies.
  SolderMaskExpansionFromHoleEdgeWithRule:
    summary: Returns whether the pad's solder mask expansion is measured from the edge of the hole, taking the design
      rules into account.
    remarks: When the solder mask expansion comes from the design rules, the applicable rule decides; when it is set
      manually, the result is `SolderMaskExpansionFromHoleEdge`. Returns false for a pad that is not on
      `TV6_Layer.eV6_MultiLayer`, and for a pad whose solder mask expansion neither comes from the rules nor is set
      manually.
  StackShapeOnLayer:
    summary: This property determines what shape the pad stack is on that layer.
    remarks: Assigning a value for a signal layer has no effect when `Mode` is `TPadMode.ePadMode_Simple` and the layer
      is not the top layer, or when `Mode` is `TPadMode.ePadMode_LocalStack` and the layer is an internal signal layer
      other than the first one.
    seeAlso:
      - PCB.TShape
  SwapID_Pad:
    summary: The pin swap identifier of the pad, used for gate and pin swapping.
  SwapID_Part:
    summary: The part swap identifier of the pad, used for gate and pin swapping.
  SwappedPadName:
    summary: The name of the pad after gate and pin swapping.
  TemplateLink:
    summary: The link from the pad to a pad and via template.
    remarks: The SDK examples re-link a pad to another template by reading `TemplateLink` between `BeginModify` and
      `EndModify` and assigning new `LibraryID` and `TemplateID` values to the returned link.
  TopShape:
    summary: The shape of the pad on the top layer.
    remarks: In a simple pad (`TPadMode.ePadMode_Simple`) it is the shape on all layers.
    seeAlso:
      - PCB.TShape
  TopXSize:
    summary: The X size of the pad on the top layer.
    remarks: In a simple pad (`TPadMode.ePadMode_Simple`) it is the X size on all layers.
  TopYSize:
    summary: The Y size of the pad on the top layer.
    remarks: In a simple pad (`TPadMode.ePadMode_Simple`) it is the Y size on all layers.
  UpdateCache:
    summary: Recalculates the pad's cached design rule values that are out of date.
    remarks: Covers the plane connection style and plane connections, the relief conductor width, entries and air gap,
      the paste mask and solder mask expansion, the power plane clearance and relief expansion, and the tenting of
      both sides. The pad's calculated sizes and shapes are brought up to date as well.
  ValidateSizeShape:
    summary: Recalculates the pad's calculated sizes and shapes if they are out of date.
    remarks: Does nothing when they are up to date. `ReValidateSizeShape` always recalculates them.
  ReValidateSizeShape:
    summary: Marks the pad's calculated sizes and shapes as out of date and recalculates them.
  WidthOnLayer:
    summary: The width of the pad on the given layer, the smaller of its X and Y sizes on that layer.
  XLocation:
    summary: The X coordinate of the pad's location, in internal units (10,000 per mil).
  XPadOffsetOnLayer:
    summary: The offset in X of the pad's copper shape from the pad's location on the given layer, in internal units
      (10,000 per mil).
  XSizeOnLayer:
    summary: This property determines what size in X direction the pad is on this specified layer.
    remarks: On an internal plane layer where the pad's hole straddles planes, the value is the hole's size in X plus
      twice `PowerPlaneClearance`, so that the pad is not connected to the plane.
  XStackSizeOnLayer:
    summary: The X size of the pad on the given layer of a full stack (`TPadMode.ePadMode_ExternalStack`).
    remarks: Assigning a value for a signal layer has no effect when `Mode` is `TPadMode.ePadMode_Simple` and the layer
      is not the top layer, or when `Mode` is `TPadMode.ePadMode_LocalStack` and the layer is an internal signal layer
      other than the first one.
    seeAlso:
      - PCB.TPadMode
  YLocation:
    summary: The Y coordinate of the pad's location, in internal units (10,000 per mil).
  YPadOffsetOnLayer:
    summary: The offset in Y of the pad's copper shape from the pad's location on the given layer, in internal units
      (10,000 per mil).
  YSizeOnLayer:
    summary: This property determines what size in Y direction the pad is on this specified layer.
    remarks: On an internal plane layer where the pad's hole straddles planes, the value is the hole's size in Y (its
      `HoleSize`) plus twice `PowerPlaneClearance`, so that the pad is not connected to the plane.
  YStackSizeOnLayer:
    summary: The Y size of the pad on the given layer of a full stack (`TPadMode.ePadMode_ExternalStack`).
    remarks: Assigning a value for a signal layer has no effect when `Mode` is `TPadMode.ePadMode_Simple` and the layer
      is not the top layer, or when `Mode` is `TPadMode.ePadMode_LocalStack` and the layer is an internal signal layer
      other than the first one.
