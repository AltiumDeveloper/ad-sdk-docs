# PCB.IPCB_RectangularPrimitive: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The base interface of PCB primitives whose shape is a rectangle with a rotation, such as `IPCB_Fill`,
  `IPCB_Text` and `IPCB_EmbeddedBoard`.
remarks: >-
  The corners (`X1Location`, `Y1Location`) and (`X2Location`, `Y2Location`) define the boundary of the rectangle,
  `XLocation` and `YLocation` its reference point, and `Rotation` its rotation. The coordinates are in internal units
  (10,000 per mil).
members:
  IsRedundant:
    summary: Returns whether the primitive is redundant.
    remarks: >-
      For a fill, returns true when the rectangle has no width or no height: `X1Location` equals `X2Location`, or
      `Y1Location` equals `Y2Location`. For text and embedded boards the method always returns false.
  RotateAroundXY:
    summary: Rotates the primitive about a point by an angle.
    remarks: >-
      The primitive is moved around the point and the angle is added to `Rotation`; the size of the primitive is then
      recalculated. For a fill, the center of the rectangle is rotated about the point and the corners keep their
      offsets from it, so passing the center (midway between `X1Location` and `X2Location`, and between `Y1Location`
      and `Y2Location`) rotates the fill without moving it; you can also use the `Rotation` property. For an embedded
      board the method always rotates by 90 degrees, whatever angle is passed.
    parameters:
      argX: The X coordinate of the point to rotate about, in internal units (10,000 per mil).
      argY: The Y coordinate of the point to rotate about, in internal units (10,000 per mil).
      argngle: The rotation angle, in degrees.
  Rotation:
    summary: The rotation of the primitive, in degrees.
  SetState_XSizeYSize:
    summary: Recalculates the stored size of the primitive.
    remarks: For a fill it also recalculates the area of the rectangle. `RotateAroundXY` calls this method itself.
  X1Location:
    summary: The X coordinate of the first corner of the rectangle, in internal units (10,000 per mil).
    remarks: The corners (`X1Location`, `Y1Location`) and (`X2Location`, `Y2Location`) define the boundary of the
      primitive.
  X2Location:
    summary: The X coordinate of the second corner of the rectangle, in internal units (10,000 per mil).
    remarks: The corners (`X1Location`, `Y1Location`) and (`X2Location`, `Y2Location`) define the boundary of the
      primitive.
  XLocation:
    summary: The X coordinate of the primitive's reference point, in internal units (10,000 per mil).
  Y1Location:
    summary: The Y coordinate of the first corner of the rectangle, in internal units (10,000 per mil).
    remarks: The corners (`X1Location`, `Y1Location`) and (`X2Location`, `Y2Location`) define the boundary of the
      primitive.
  Y2Location:
    summary: The Y coordinate of the second corner of the rectangle, in internal units (10,000 per mil).
    remarks: The corners (`X1Location`, `Y1Location`) and (`X2Location`, `Y2Location`) define the boundary of the
      primitive.
  YLocation:
    summary: The Y coordinate of the primitive's reference point, in internal units (10,000 per mil).
