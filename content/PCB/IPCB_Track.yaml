# PCB.IPCB_Track: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: A straight track segment on a PCB document, from (`X1`, `Y1`) to (`X2`, `Y2`), with a stroke `Width`.
remarks: |-
  Tracks can be placed on any layer and their widths can range from 0.001 to 10000 mils wide. Tracks are used to
  create polygon planes and are also used in coordinates, dimensions and components.

  The coordinates and the width are in internal units: 10,000 per mil (`EDP.EDPConstant.InternalUnits`). Convert with
  `EDP.Utils.MilsToCoord` and `EDP.Utils.MMsToCoord`, and back with `EDP.Utils.CoordToMils` and
  `EDP.Utils.CoordToMMs`. To get a coordinate relative to the board origin, subtract `IPCB_Board.XOrigin` or
  `IPCB_Board.YOrigin`.

  Tracks that carry either signals or power supply can be placed on:

  • Top (component side) signal layer.

  • Any of the thirty mid signal layers.

  • Bottom (solder side) signal layer.

  Non-electrical tracks can also be placed on:

  • Any of the silk screen overlays (normally used for component package outlines).

  • Any of the sixteen internal plane layers (used as voids in these solid copper planes).

  • The keep out layer to define the board perimeter for autorouting and auto component placement

  • Any of the sixteen mechanical layers for mechanical details.

  • Solder or paste mask layers for any special openings required in the masks
members:
  Width:
    summary: The stroke width of the track, in internal units (10,000 per mil).
  X1:
    summary: The X coordinate of the track's first end point, in internal units (10,000 per mil).
  X2:
    summary: The X coordinate of the track's second end point, in internal units (10,000 per mil).
  Y1:
    summary: The Y coordinate of the track's first end point, in internal units (10,000 per mil).
  Y2:
    summary: The Y coordinate of the track's second end point, in internal units (10,000 per mil).
