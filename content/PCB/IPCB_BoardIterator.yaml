# PCB.IPCB_BoardIterator: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The IPCB_BoardIterator iterates through a PCB document to fetch PCB design objects on this PCB.
remarks: >-
  With the iterator, you can control which objects on which layers and within specified regions with the
  AddFilter_ObjectSet , AddFilter_LayerSet and AddFilter_Area methods to be fetched.


  `AddFilter_Method` controls how design objects are fetched. The TIterationMethod type has three different values:
  `TIterationMethod.eProcessAll`, `TIterationMethod.eProcessFree` and `TIterationMethod.eProcessComponent`.
