# PCB.IPCB_StrokeArray: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The line strokes of a text converted with `IPCB_Text.ConvertToStrokeArray`.
members:
  StrokeRecord:
    summary: Returns a stroke of the converted text, a straight line segment given by its two end points in internal
      units (10,000 per mil).
