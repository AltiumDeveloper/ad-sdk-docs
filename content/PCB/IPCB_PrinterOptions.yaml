# PCB.IPCB_PrinterOptions: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The printer and plotter settings of a PCB document in the PCB Editor, returned by `IPCB_Board.PrinterOptions`.
remarks: >-
  The interface extends `IPCB_AbstractOptions`. The settings form two groups: general options (device, scaling, plot
  modes, pad annotation and pen-plotter settings) and per-layer composite options (`CompositePlotLayers`,
  `CompositePlotPens`, `CompositePlotMonoLayers`, `CompositePlotColorLayers`). Each group can be written to and read
  from a parameter string.


  For printer options, `Import_FromParameters` and `Export_ToParameters` handle both groups;
  `Import_FromParameters_Version3` and `Export_ToParameters_Version3` handle the general options and the per-layer
  options in the version 3 layer numbering.
members:
  BatchType:
    summary: The print batch mode, plot per sheet (`TPrinterBatch.ePlotPerSheet`) or panelize
      (`TPrinterBatch.ePanelize`).
    remarks: Saved as the integer `BatchType` parameter.
  cBorderSize:
    summary: The border size of the printout, in internal units (10,000 per mil).
  CompositePlotColorLayers:
    summary: The colour used for a layer in a colour composite plot.
    remarks: Saved per layer as the integer `PC<n>` parameter, where `<n>` is the layer's number.
    parameters:
      argL: The layer.
  CompositePlotLayers:
    summary: Whether a layer is included in composite plots.
    remarks: Saved for all layers as the `PlotLayers` parameter, a string with one character per layer, `1` for an
      included layer and `0` for an excluded one.
    parameters:
      argL: The layer.
  CompositePlotMonoLayers:
    summary: The colour used for a layer in a monochrome composite plot.
    remarks: Saved per layer as the integer `PM<n>` parameter, where `<n>` is the layer's number.
    parameters:
      argL: The layer.
  CompositePlotPens:
    summary: The pen-plotter pen number assigned to a layer.
    remarks: Saved per layer as the integer `PP<n>` parameter, where `<n>` is the layer's number.
    parameters:
      argL: The layer.
  CompositeType:
    summary: The composite print mode, colour (`TPrinterComposite.eColorComposite`) or monochrome
      (`TPrinterComposite.eMonoComposite`).
    remarks: Saved as the integer `CompositeType` parameter.
  Device:
    summary: The name of the target printer device.
  Driver:
    summary: The name of the printer driver.
  Export_ToParameters_GeneralOptions:
    summary: Writes the general printer settings to a parameter string.
    remarks: >-
      Writes `Record=PrinterOptions` and the parameters `Device`, `Driver`, `Output`, `ShowHoles`, `ScaleToFitPage`,
      `UsePrinterFonts`, `UseSoftwareArcs`, `BatchType`, `CompositeType`, `cBorderSize`, `Scale`, `XCorrect`,
      `YCorrect`, `PlotPadNets`, `PlotPadNumbers`, the `Plotter*` settings, `SPD<n>` and `THK<n>` for pens 1 to 8,
      `PlotMode` and `DriverType`. Enumerated values are written as integers. The per-layer settings are not written:
      use `Export_ToParameters_LayerOptions`.
    parameters:
      argParameters: The parameter string that receives the settings.
  Export_ToParameters_LayerOptions:
    summary: Writes the per-layer composite settings to a parameter string.
    remarks: Writes the `PlotLayers` parameter (`CompositePlotLayers`) and, for every layer, `PP<n>`
      (`CompositePlotPens`), `PM<n>` (`CompositePlotMonoLayers`) and `PC<n>` (`CompositePlotColorLayers`), where `<n>`
      is the layer's number.
    parameters:
      argParameters: The parameter string that receives the settings.
  Export_ToParameters_LayerOptions_Version3:
    summary: Writes the per-layer composite settings to a parameter string in the version 3 layer numbering.
    remarks: Writes the same parameters as `Export_ToParameters_LayerOptions`, but numbers the layers as the version 3
      format does; layers that have no version 3 equivalent are left out.
    parameters:
      argParameters: The parameter string that receives the settings.
  Import_FromParameters_GeneralOptions:
    summary: Reads the general printer settings from a parameter string.
    remarks: >-
      Reads the parameters that `Export_ToParameters_GeneralOptions` writes; the per-layer settings are read by
      `Import_FromParameters_LayerOptions`. When the string contains `PlotMode`, the object kinds covered by that value
      all receive the draw mode given by its first character.
    parameters:
      argDisplayUnit: The unit used to read coordinate values, such as `cBorderSize`, the plotter offsets and the pen
        thicknesses.
      argParameters: The parameter string to read.
  Import_FromParameters_LayerOptions:
    summary: Reads the per-layer composite settings from a parameter string.
    remarks: Reads the parameters that `Export_ToParameters_LayerOptions` writes. A layer whose parameter is missing
      keeps its current value.
    parameters:
      argParameters: The parameter string to read.
  Import_FromParameters_LayerOptions_Version3:
    summary: Reads the per-layer composite settings from a parameter string that uses the version 3 layer numbering.
    remarks: Reads the same parameters as `Import_FromParameters_LayerOptions` and converts each version 3 layer
      number to the corresponding current layer. A layer whose parameter is missing keeps its current value.
    parameters:
      argParameters: The parameter string to read.
  OutPut:
    summary: The printer output string.
    remarks: Saved as the `Output` parameter.
  OutputDriverType:
    summary: The type of output driver.
    remarks: Saved as the integer `DriverType` parameter.
  PlotMode:
    summary: The draw mode (full, draft or hidden) used to plot objects of a given kind.
    remarks: Saved for all object kinds as the `PlotMode` parameter, a string with one digit per object kind.
    parameters:
      argOId: The object kind.
  PlotPadNets:
    summary: Whether pad net names are printed.
  PlotPadNumbers:
    summary: Whether pad numbers are printed.
  PlotterLanguage:
    summary: The command language of the pen plotter, HPGL (`TPlotterLanguage.ePlotterLanguageHPGL`) or DMPL
      (`TPlotterLanguage.ePlotterLanguageDMPL`).
    remarks: Saved as the integer `PlotterLanguage` parameter.
  PlotterOutputPort:
    summary: The port or file the pen plotter output is sent to.
    remarks: Saved as the integer `PlotterOutputPort` parameter.
  PlotterPens:
    summary: The speed and thickness of a pen-plotter pen.
    remarks: >-
      The pen's `Thickness` is in internal units (10,000 per mil). Pens 1 to 8 are saved as the `SPD<n>` (speed) and
      `THK<n>` (thickness) parameters.
    parameters:
      argPen: The pen number.
  PlotterScale:
    summary: The scale factor of pen-plotter output.
  PlotterShowHoles:
    summary: Whether holes are drawn on pen-plotter output.
  PlotterUseSoftwareArcs:
    summary: Whether arcs on pen-plotter output are drawn in software.
  PlotterWaitBetweenSheets:
    summary: Whether the pen plotter pauses between sheets.
  PlotterXCorrect:
    summary: The horizontal correction factor of pen-plotter output.
  PlotterXOffset:
    summary: The horizontal offset of pen-plotter output, in internal units (10,000 per mil).
  PlotterYCorrect:
    summary: The vertical correction factor of pen-plotter output.
  PlotterYOffset:
    summary: The vertical offset of pen-plotter output, in internal units (10,000 per mil).
  Scale:
    summary: The print scale factor, used when `ScaleToFitPage` is false.
    remarks: The `Print_Scale` special string shows this value with two decimals, or `SCALED TO FIT` when
      `ScaleToFitPage` is true.
  ScaleToFitPage:
    summary: Whether the printout is scaled to fit the page instead of using `Scale`.
  ShowHoles:
    summary: Whether pad and via holes are shown on printed output.
  UsePrinterFonts:
    summary: Whether text is printed with the printer's fonts.
  UseSoftwareArcs:
    summary: Whether arcs on printed output are drawn in software.
  XCorrect:
    summary: The horizontal scale correction factor of the printer.
  YCorrect:
    summary: The vertical scale correction factor of the printer.
