# PCB.IPCB_DifferentialPairsRoutingRule: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: A differential signaling system is one where a signal is transmitted down a pair of tightly coupled carriers,
  one of these carrying the signal, the other carrying an equal but opposite image of the signal. Differential signaling
  was developed to cater for situations where the logic reference ground of the signal source could not be well
  connected to the logic reference ground of the load. Differential signaling is inherently immune to common mode
  electrical noise, the most common interference artifact present in an electronic product. Another major advantage of
  differential signaling is that it minimizes electromagnetic interference (EMI) generated from the signal pair.
remarks: >-
  Differential pair routing is a design technique employed to create a balanced transmission system able to carry
  differential (equal and opposite) signals across a printed circuit board. Typically this differential routing will
  interface to an external differential transmission system, such as a connector and cable.


  It is important to note that while the coupling ratio achieved in a twisted pair differential cable may be better than
  99%, the coupling achieved in differential pair routing will typically be less than 50%. Current expert opinion is
  that the PCB routing task is not to try to ensure a specific differential impedance is achieved, rather the objective
  is to maintain the properties required to ensure the differential signal arrives in good condition at the target
  component as it travels from the external cabling.


  The IPCB_FanoutControl rule determines how BGAs on a PCB document is going to be fanned in respect to vias placement
  for routing.


  This interface defines the minimum clearance between any two primitive objects on a copper layer.


  The PrimitivesViolate method checks if two primitives violate the minimum clearance or not.


  The Gap property determines the gap size of the track segments.
