# PCB.IPCB_ServerInterface: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: When you need to work with PCB design objects in Altium Designer, the starting point is to invoke the PCBServer
  method which returns the IPCB_ServerInterface interface. You can extract the all other derived PCB interfaces that are
  exposed in the I PCB_ServerInterface interface.
remarks: >-
  Note that these IServerModule interfaces represent loaded servers in Altium Designer. The Altium Designer application
  manages single instances of different server modules. Each server can have multiple server document kinds, for example
  the PCB server supports two server document kinds - PCB and PCBLIB design documents. A loaded server in Altium
  Designer typically hosts documents and each document in turn hosts a document view and panel views. Thus a PCB server
  also has the IServerModule interface along with the IPCB_ServerInterface interface.


  To get an access to the current PCB document open in Altium Designer, you would invoke the GetCurrentPCBBoard method
  from the IPCB_ServerInterface interface object to obtain the IPCB_Board interface.


  The factory methods produce specialized objects. For example the PCBObjectFactory method is invoked to produce a new
  PCB object. You will need to add this object in a PCB board. The TObjectCreationKind type denotes how the attributes
  of a new PCB object is set (either from software default settings or from global settings as defined in the
  Preferences dialog within PCB).


  The SendMessageToRobots , PreProcess and PostProcess methods are used when you need to keep the Undo system and other
  sub systems of the PCB editor in synchronization, when you are adding, deleting or modifying objects to/from the PCB
  document.
members:
  CreatePCBLibComp:
    summary: The CreatePCBLibComp method creates a IPCB_LibComponent based object interface that represents a library
      component within a library document.
    seeAlso:
      - PCB.IPCB_LibComponent
      - PCB.IPCB_ServerInterface.DestroyPCBLibComp
  DestroyPCBContour:
    summary: This DestroyPCBContour method destroys the object represented by the IPCB_Contour interface which was created
      by the PCBContourFactory method.
    seeAlso:
      - PCB.IPCB_Contour
      - PCB.IPCB_ServerInterface.PCBContourFactory
  DestroyPCBLibComp:
    summary: This method destroys a footprint within a library but it is not eliminated from the computer's memory. A
      library is composed of footprints as pages and each footprint is represented by the IPCB_LibComponent interface.
  DestroyPCBObject:
    summary: This method destroys a PCB object from the PCB document. It is removed but not eliminated from computer memory.
      For instance, the Undo system can bring this object back.
    seeAlso:
      - PCB.IPCB_LibComponent
  GetCurrentPCBBoard:
    summary: This method returns you the IPCB_Board interface which represents the PCB document OR the PCB Library document.
      The IPCB_Board interface has a IsLibrary method which determines which type the document is; the PCB or PCBLib
      document.
  GetCurrentPCBLibrary:
    summary: This method returns the IPCB_Library interface which represents the PCB library document.
    seeAlso:
      - PCB.IPCB_Library
  GetPCBBoardByPath:
    summary: This method returns you the IPCB_Board interface representing the PCB document only if the path (APath
      parameter) represents a valid PCB document.
  GetPCBLibraryByPath:
    summary: This method returns you the IPCB_Library interface representing the PCB document only if the path (APath
      parameter) represents this document.
    seeAlso:
      - PCB.IPCB_Library
  InteractiveRoutingOptions:
    summary: This property returns you the IPCB_InteractiveRoutingOptions interface which represents the interactive routing
      options in the PCB editor.
    seeAlso:
      - PCB.IPCB_InteractiveRoutingOptions
  LoadCompFromLibrary:
    summary: This method produces an object which is represented by the IPCB_LibComponent interface. A footprint in a
      library is also represented by the IPCB_LibComponent interface.
    seeAlso:
      - PCB.IPCB_LibComponent
  PCBClassFactory:
    summary: This method produces an object represented by the IPCB_ObjectClass interface. An Object class is a Design Rules
      Class that can store members which represent a group of design objects targetted by the design rules system in the
      PCB editor.
  PCBClassFactoryByClassMember:
    summary: This method produces an object represented by the IPCB_ObjectClass interface. An Object class is a Design Rules
      Class that can store members which represent a group of design objects targetted by the design rules system in the
      PCB editor.
  PCBContourFactory:
    summary: The PCBContourFactory method creates a contour object based on the Arc resolution, the centre X and Y
      coordinates and the orientation of the contour.
    seeAlso:
      - PCB.IPCB_Contour
      - PCB.IPCB_ServerInterface.DestroyPCBContour
  PCBObjectFactory:
    summary: This method produces a PCB design object which is represented by the IPCB_Primitive interface. The
      IPCB_Primitive interface is the ancestor interface for all PCB design objects in Altium Designer.
    remarks: >-
      The TObjectID value determines which object you wish to produce.


      The TDimensionKind value determines which dimension object you wish to produce. By default it is eNoDimension.


      The TObjectCreationMode type determines which default values are used - from the PCB Preferences dialog or default
      values used internally from the PCB Editor.
  PCBRuleFactory:
    summary: This method produces a design rule object which is represented by the IPCB_Rule interface.
  PostProcess:
    summary: This method cleans up the robots process in the PCB editor, after a PreProcess method and SendMessageToRobots
      messages have been invoked. This also stops the robots from listening to any more PCB messages.
    seeAlso:
      - PCB.IPCB_ServerInterface.PreProcess
  SpecialStringConverter:
    summary: This property is a read only property, however if you obtain the IPCB_SpecialStringConverter interface, then
      you can invoke methods or properties to change the data within.
    seeAlso:
      - PCB.IPCB_SpecialStringConverter
  SystemOptions:
    summary: The property returns you the IPCB_SystemOptions interface. This interface is represented by the System Options
      in the PCB editor such as PCB document display options,
    seeAlso:
      - PCB.IPCB_SystemOptions
