# PCB.IPCB_ComponentClearanceConstraint: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: A component clearance rule (`TRuleKind.eRule_ComponentClearance`) that defines the minimum distance between
  components, horizontally (`Gap`) and vertically (`VerticalGap`).
remarks: >-
  The rule checks pairs of components and component bodies (`IPCB_ComponentBody`). A new rule has a horizontal and a
  vertical clearance of 10 mil.
members:
  CollisionCheckMode:
    summary: A check mode that the rule no longer uses.
    remarks: >-
      Reading always returns `TComponentCollisionCheckMode.eComponentBodyCheck`; assigning a value has no effect.
  Gap:
    summary: The minimum horizontal clearance between components, in the plane of the board, in internal units
      (10,000 per mil).
    remarks: A new rule has 10 mil.
  ShowDistances:
    summary: Whether the check searches for the closest points of two components that are closer than the clearance,
      instead of stopping at the first points found within the clearance.
    remarks: The default is false.
  VerticalGap:
    summary: The minimum vertical clearance between components, perpendicular to the board, in internal units (10,000
      per mil).
    remarks: A new rule has 10 mil.
