# PCB.IPCB_LayerStack: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: A layer stack of a board, such as the one `IPCB_Board.LayerStack` returns or a substack of the board's
  `IPCB_MasterLayerStack`.
remarks: >-
  Walk its layers with the members inherited from `IPCB_LayerStackBase`, such as `IPCB_LayerStackBase.Iterator`,
  `IPCB_LayerStackBase.First` and `IPCB_LayerStackBase.Next`. The layer walk with `FirstLayer` and `NextLayer` belongs
  to `IPCB_LayerStack_V7`, which `IPCB_Board.LayerStack_V7` returns.


  Each kind of layer has its own interface derived from `IPCB_LayerObject`, such as `IPCB_SignalLayer`,
  `IPCB_InternalPlane`, `IPCB_DielectricLayer` and `IPCB_SolderMaskLayer`.
members:
  Board:
    summary: Returns the board that owns the layer stack, or null when there is none.
    seeAlso:
      - PCB.IPCB_Board
  BottomSignalLayer:
    summary: Returns the layer ID of the last electrical layer of the layer stack that is not a coverlay layer.
    remarks: Returns the bottom layer when the stack has no such layer.
  DielectricBottom:
    summary: The bottom solder mask layer of the layer stack, or null when the stack has none.
    seeAlso:
      - PCB.IPCB_SolderMaskLayer
  DielectricTop:
    summary: The top solder mask layer of the layer stack, or null when the stack has none.
    seeAlso:
      - PCB.IPCB_SolderMaskLayer
  LayerObject:
    summary: Returns the layer object of the given layer.
    remarks: >-
      For a layer that is not in the layer stack it returns the master layer stack's layer object with that layer ID,
      created when needed. So it also returns a layer object for a layer that is not in the stack, such as a keep-out
      layer or a mechanical layer.
    parameters:
      argLayer: The layer, from `TV6_Layer.eV6_TopLayer` to `TV6_Layer.eV6_ViaHoleLayer`; any other value returns null.
    seeAlso:
      - PCB.IPCB_LayerObject
  LayerObject_1:
    summary: Returns the layer object of the given layer.
    remarks: >-
      For a layer that is not in the layer stack it returns the master layer stack's layer object with that layer ID,
      created when needed. So it also returns a layer object for a layer that is not in the stack, such as a keep-out
      layer or a mechanical layer.
    seeAlso:
      - PCB.IPCB_LayerObject
  ShowBotDielectric:
    remarks: The value is a stored flag of the layer stack; setting it changes only the flag.
  ShowTopDielectric:
    remarks: The value is a stored flag of the layer stack; setting it changes only the flag.
  TopSignalLayer:
    summary: Returns the layer ID of the first electrical layer of the layer stack that is not a coverlay layer.
    remarks: Returns the top layer when the stack has no such layer.
