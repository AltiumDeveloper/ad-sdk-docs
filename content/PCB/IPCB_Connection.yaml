# PCB.IPCB_Connection: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: A connection line between two points on a PCB document, either a ratsnest connection or a broken net marker.
remarks: >-
  Each end of the connection has its own coordinates (`X1`, `Y1` and `X2`, `Y2`) and its own layer (`Layer1` and
  `Layer2`), so the two ends can be on different layers. `Mode` tells whether the connection is a ratsnest connection
  or a broken net marker.


  A new connection has both ends at (0, 0) on `TV6_Layer.eV6_MultiLayer`, and its `Mode` is
  `TConnectionMode.eRatsNestConnection`.
members:
  IsRedundant:
    summary: Returns whether the connection is redundant.
    remarks: >-
      Returns true when both ends are the same point: `X1` equals `X2`, `Y1` equals `Y2`, `Layer1` equals `Layer2`,
      and the 3D face data of the two ends are equal.
  Layer1:
    summary: The layer of the connection's first end, (`X1`, `Y1`).
  Layer2:
    summary: The layer of the connection's second end, (`X2`, `Y2`).
  Mode:
    summary: Whether the connection is a ratsnest connection or a broken net marker.
    seeAlso:
      - PCB.TConnectionMode
  RotateAroundXY:
    summary: Rotates the connection about a point by an angle.
    remarks: >-
      Both ends are rotated about the point; their layers do not change. To rotate the connection without moving it,
      pass its midpoint (midway between `X1` and `X2`, and between `Y1` and `Y2`) as the point.
    parameters:
      argX: The X coordinate of the point to rotate about, in internal units (10,000 per mil).
      argY: The Y coordinate of the point to rotate about, in internal units (10,000 per mil).
      argngle: The rotation angle, in degrees.
  X1:
    summary: The X coordinate of the connection's first end, in internal units (10,000 per mil).
  X2:
    summary: The X coordinate of the connection's second end, in internal units (10,000 per mil).
  Y1:
    summary: The Y coordinate of the connection's first end, in internal units (10,000 per mil).
  Y2:
    summary: The Y coordinate of the connection's second end, in internal units (10,000 per mil).
