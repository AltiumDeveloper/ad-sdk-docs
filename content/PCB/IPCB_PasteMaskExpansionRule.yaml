# PCB.IPCB_PasteMaskExpansionRule: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: A paste mask expansion rule (`TRuleKind.eRule_PasteMaskExpansion`) that defines how much the paste mask shape
  of each pad site is expanded or contracted radially.
remarks: >-
  The rule applies to pads, vias, tracks, arcs, fills and regions whose paste mask expansion comes from the rule, not
  from a manual value. Besides an absolute expansion (`Expansion`), a rule can give the expansion as a percentage, or
  apply no paste (not available through this interface).
members:
  Expansion:
    summary: The radial expansion of the paste mask shape, in internal units (10,000 per mil); a negative value
      contracts it.
    remarks: >-
      A new rule has 0. While the rule gives the expansion as a percentage, this value is not used. While the rule
      applies no paste, assigning a value sets the expansion to 0.
