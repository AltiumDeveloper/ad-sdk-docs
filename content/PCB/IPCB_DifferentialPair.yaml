# PCB.IPCB_DifferentialPair: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: A differential pair on a PCB document, a named pair of nets, a positive and a negative net, that carry a signal
  and its equal but opposite image.
remarks: >-
  The pair refers to its nets by name and finds them on the board when `PositiveNet` or `NegativeNet` is read. A net that
  is assigned to or found by the pair belongs to it: its `IPCB_Net.InDifferentialPair` is true. When the pair is removed
  from the board, its nets no longer belong to a differential pair.
members:
  GatherControl:
    remarks: A new differential pair has false.
  Name:
    summary: The name of the differential pair.
    remarks: >-
      The name is also the pair's `Identifier`; `DescriptorString` returns `Differential Pair` followed by a space and
      the name.
  NegativeNet:
    summary: The negative net of the pair.
    remarks: >-
      Assigning a net stores its name and makes the net part of the pair; assigning null clears the stored name. When
      the pair has a stored name but no net, for example after the document is loaded, reading the property looks up
      the net with that name on the board; the result is null when no net has that name.
  PositiveNet:
    summary: The positive net of the pair.
    remarks: >-
      Assigning a net stores its name and makes the net part of the pair; assigning null clears the stored name. When
      the pair has a stored name but no net, for example after the document is loaded, reading the property looks up
      the net with that name on the board; the result is null when no net has that name.
