# PCB.IPCB_Violation: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: A design rule violation on a PCB document, the rule that is broken and the object, or pair of objects, that
  break it.
remarks: >-
  A violation of a binary design rule refers to two objects, `Primitive1` and `Primitive2`; a violation of a unary design
  rule refers to one object, `Primitive1`, and `Primitive2` is null. Check `Primitive2` before using it. `Rule` returns
  the rule, and `Name` and `Description` describe the violation. Violations are returned by the rule checks of
  `IPCB_Rule`, such as `IPCB_Rule.ActualCheck`.
members:
  Description:
    summary: The description of the violation.
    remarks: The description is part of the violation's `DescriptorString`.
    seeAlso:
      - PCB.IPCB_Violation.Name
  IsRedundant:
    summary: Returns whether the violation is between an object and itself.
    remarks: >-
      True when `Primitive1` and `Primitive2` are both set and are the same object (for a polygon, the same part of
      it); false otherwise, and always false for a violation of a unary rule.
  Name:
    summary: The name of the violation.
    remarks: >-
      The name is a number with at least four digits that increases with each violation created, followed by a colon,
      a space and the object kind of `Primitive1`, such as `Track`, or the object kinds of `Primitive1` and `Primitive2`
      separated by a slash with a space on each side. When `Primitive1` is a net, its name follows in parentheses.
    seeAlso:
      - PCB.IPCB_Violation.Description
  Primitive1:
    summary: The first object of the violation, or the only object for a violation of a unary rule.
    remarks: >-
      For a back-drill via the property returns the via it was drilled from, and for a region that is part of some
      solid polygons it returns the polygon.
  Primitive2:
    summary: The second object of the violation; null for a violation of a unary rule.
    remarks: >-
      For a back-drill via the property returns the via it was drilled from, and for a region that is part of some
      solid polygons it returns the polygon.
  Rule:
    summary: The design rule that the violation breaks.
    remarks: The rule is returned as an `IPCB_Primitive`; the object is an `IPCB_Rule`.
    seeAlso:
      - PCB.IPCB_Rule
  ShortDescriptorString:
    summary: A short description of the violation, which starts with the kind of the rule and names the objects of the
      violation.
