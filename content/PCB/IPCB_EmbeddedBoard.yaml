# PCB.IPCB_EmbeddedBoard: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The IPCB_EmbeddedBoard interface represents an embedded board object consisting of multiple child PCBs in a
  matrix of rows and columns which is an embedded board array feature. Each board array can reference a different pcb
  file.
remarks: >-
  • The IPCB_EmbeddedBoard interface is inherited from the IPCB_RectangularPrimitive interface.


  • The RowSpacing and ColSpacing values determine the gap between items in the matrix of rows and columns.


  • The DocumentPath string refers to the referenced PCB file. The corresponding ChildBoard interface represents the
  child referenced PCB.


  • The OriginMode property denotes how the array is referenced from the origin of the embedded board or let the PCB
  editor build the array based on the bottom left of the objects in the referenced board's workspace.


  • The MirrorFlag denotes whether the embedded board is to be flipped over or not.
members:
  ChildBoard:
    summary: This ChildBoard property represents the reference PCB document to be used for the embedded board panellization.
  ColCount:
    summary: This ColCount property represents the number of columns that the board array will have. You can also define the
      RowCount property as well to define the size of the matrix for the board array.
  ColSpacing:
    summary: The ColSpacing property determines the height of the first board and the gap between two boards. This column
      spacing and the row spacing values are used to generate an embedded board array.
  DocumentPath:
    summary: This DocumentPath property represents the path to the referenced PCB for the board panellization.
  Mirror:
    summary: The MirrorFlag property represents the mirrored state of the embedded board panel of PCBs. Set true to mirror
      it, or false to leave the embedded board panel as is.
  OriginMode:
    summary: This OriginMode property references the board array from the origin of the embedded board or from the bottom
      left of the referenced board's workspace.
    remarks: >-
      From the bottom left is the default value which has the software build the array based on the bottom left of the
      objects in the referenced board's workspace (which is the child PCB document).


      Note that the reference point (as a red cross) of the board array is defined by the child PCB document that is
      used as the base for the board array to place on a PCB document. To change the reference point (origin) of the
      child board object, click Edit » Origin » Reset / Set menu items to set the origin marker from the PCB menu.
    seeAlso:
      - PCB.TEmbeddedBoardOriginMode
  RowCount:
    summary: This RowCount property represents the number of rows that the board array will have. You can also define the
      ColCount property as well to define the size of the matrix for the board array.
  RowSpacing:
    summary: The RowSpacing property determines the width of the first board and the gap between two boards. This row
      spacing and the column spacing values are used to generate an embedded board array.
