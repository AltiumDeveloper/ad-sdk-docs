# PCB.IPCB_EmbeddedBoard: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: An embedded board array, a rectangular object on a board that places copies of another PCB document (the
  child board) in a matrix of rows and columns. Each board array can reference a different PCB document.
remarks: >-
  The interface extends `IPCB_RectangularPrimitive`. `DocumentPath` names the child PCB document and `ChildBoard`
  returns its board.


  The copies are arranged in `RowCount` rows and `ColCount` columns, `RowSpacing` and `ColSpacing` apart. The first
  copy is placed with the point selected by `OriginMode` at the embedded board's location (`XLocation`,
  `YLocation`); each further row is offset upwards by `RowSpacing` and each further column to the right by
  `ColSpacing`. The copies are then mirrored when `Mirror` is true and rotated about the location by `Rotation`.
members:
  ApplyFilterToIterator:
    summary: Applies the embedded board's transmit filter to an iterator, so that the iterator returns only the objects
      that the filter passes.
    remarks: >-
      Board, spatial and group iterators are supported; any other iterator, or null, is left unchanged. The filter
      rejects objects on layers for which `TransmitLayersEnabled` is false and, when the embedded board is set not to
      transmit them, dimensions, drill tables and layer stack tables.
    parameters:
      argIterator: The iterator to filter, typically one created on `ChildBoard`.
  ChildBoard:
    summary: The board of the child PCB document that `DocumentPath` refers to.
    remarks: Null when no PCB document with that path is loaded.
  ColCount:
    summary: The number of columns of child board copies in the array.
    remarks: A newly created embedded board starts with 1.
  ColSpacing:
    summary: The horizontal distance from one column of copies to the next, in internal units (10,000 per mil).
    remarks: The gap between two columns is this value minus the width of the child board. A newly created embedded
      board starts with 1500 mil.
  DocumentPath:
    summary: The full path of the child PCB document used for the board array.
    remarks: >-
      When the embedded board belongs to a board, the path is kept relative to the folder of that board's document,
      and reading it returns the full path resolved against that folder. Setting the path of the document that
      contains the embedded board clears the stored path.
  GetForbiddenParameterList:
    summary: Returns the parameters whose transmission from the child board is disabled, or null when there are none.
  Mirror:
    summary: Whether the copies of the child board are mirrored.
    remarks: Each copy is mirrored about a vertical line through the embedded board's `XLocation`, before the rotation is
      applied.
  OriginMode:
    summary: Which point of the child board is placed at the embedded board's location, the child board's origin
      (`TEmbeddedBoardOriginMode.eOriginMode_BoardOrigin`) or its bottom-left corner
      (`TEmbeddedBoardOriginMode.eOriginMode_BottomLeft`).
    remarks: >-
      The bottom-left corner is that of the child board's outline, or of the child board's objects when it has no
      outline. A newly created embedded board starts with `TEmbeddedBoardOriginMode.eOriginMode_BottomLeft`.


      The origin of the child board is defined in the child PCB document; to change it, use Edit » Origin » Set or
      Reset in that document.
    seeAlso:
      - PCB.TEmbeddedBoardOriginMode
  RowCount:
    summary: The number of rows of child board copies in the array.
    remarks: A newly created embedded board starts with 1.
  RowSpacing:
    summary: The vertical distance from one row of copies to the next, in internal units (10,000 per mil).
    remarks: The gap between two rows is this value minus the height of the child board. A newly created embedded board
      starts with 2500 mil.
  TransmitLayersEnabled:
    summary: Whether objects of the child board on a layer pass the embedded board's transmit filter.
    remarks: On a newly created embedded board, every layer passes. `ApplyFilterToIterator` applies the filter to an
      iterator.
    parameters:
      argLayer: The layer of the child board.
