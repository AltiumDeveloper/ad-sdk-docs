# DXP.IServerModule: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: A server deals with its own server documents. There can be different design document types, for example the
  Schematic Editor has two Schematic and Schematic Library document types.
remarks: >-
  Each design document, in turn stores views which can be a document window or a panel window. A server has the ability
  to host multiple panel views for a single document view, see the diagram below.


  A server also has the ability to host multiple global panel views that represent some system state and are not
  necessarily tied to a particular design document (for example the Work-Space Manager server has Message, Differences
  and Errors panels). This document view / multiple panel views structure is the foundation of Altium Designer client /
  server architecture.


  This application manages single instances of different server modules. Each server can have multiple server document
  kinds, for example the PCB server supports two server document kinds - PCB and PCBLIB design documents. A loaded
  server in Altium Designer typically hosts documents and each document in turn hosts a document view and panel views.


  The diagram below represents a server module with server documents. Each document has views - the document view and
  the associated panel view.


  An IServerModule interface has the following interfaces:


  • ICommandLauncher deals with a server's processes table


  • IServerDocument represents a loaded design document in Altium Designer


  • IServerView represents a panel that can have a view of the Altium Designer system


  • IServerDocumentView (deals with a document view (either the document window or panel window)


  These forms are wrapped by the IServerDocumentView or IServerView interface object. This IExternalForm interface
  object has low level methods such as resizing and displaying the form and is the ancestor interface for
  IServerDocumentView and IServerView interfaces.


  • IProcessControl represents the level of stacked processes for this focussed server document


  • INotification receives system notifications from the Client system and all server modules receive these
  notifications. There is an ability to handle a notification and take it from there. Documents and associated panels
  can be synchronized through the use of notifications as well.


  The PCB server module also has its IPCB_ServerInterface interface.


  The Schematic Server module also has its ISCH_ServerInterface interface.


  However both servers also have this IServerModule interface.


  IServerModule Methods and Properties Table
members:
  AddServerView:
    summary: This method adds a panel in the Server Module where this new panel can be used by the module.
    remarks: Invoke this method after you have created a IServerView object with the CreateServerView method or pass in the
      IServerView interface parameter.
    seeAlso:
      - DXP.IServerView
  ApplicationIdle:
    summary: The ApplicationIdle method is an internal method that gets invoked when Altium Designer is idling. The
      ApplicationIdle method in all active running servers gets invoked. The messages sent by Altium Designer get the
      chance to be followed up.
  CreateDocument:
    summary: The CreateDocument method creates a document supported by the server based on the AKind and AFilename parameters.
    remarks: The AKind parameter represents the document kind that the server supports and the AFileName parameter is
      assigned to the new document.
  CreateDocumentShowOrHide:
    summary: The CreateDocumentShowOrHide method controls how a document when created is displayed in Altium Designer.
  CreateOptionsView:
    summary: The CreateOptionsView creates a IDocumentOptions view to be used in the system wide Preferences dialog in
      Altium Designer.
  CreateServerDocView:
    summary: The CreateServerDocView method creates an IServerDocumentView (which could be the document or its associated
      panel view) object based on the Name of the document view and the IServerDocument container.
  CreateServerView:
    summary: The CreateServerView method creates a IServerView object representing a system panel. You need to invoke the
      AddServerView method to add the object within Altium Designer.
  DestroyDocument:
    summary: The DestroyDocument method closes and removes the design document as specified by the ADocument parameter.
  GetClient:
    summary: The GetClient method returns the IClient interface of the client subsystem of Altium Designer. This IClient
      interface can be used to invoke its methods.
    remarks: >-
      The GetClient method is used for the Client property.


      The Client property returns the IClient interface of the client subsystem of Altium Designer. This IClient
      interface can be used to invoke its methods.


      This readonly property is supported by the GetClient method.
  GetCommandLauncher:
    summary: The CommandLauncher method returns the ICommandLauncher interface. It is used to launch a process from its
      server module. The CommandLauncher object contains a command table which binds a process name to the actual method
      that implements the process at run-time.
    remarks: >-
      Whenever a process is called within the server this table is looked up in order to find the actual method pointer.
      If a process name is not found within this table then nothing will happen.


      See the ICommandLauncher interface for more details.


      This method is used for the CommandLauncher property.


      The CommandLauncher property returns the pointer to the ICommandLauncher interface. It is used to launch a process
      from its server module. The CommandLauncher object contains a command table which binds a process name to the
      actual method that implements the process at run-time.


      Whenever a process is called within the server this table is looked up in order to find the actual method pointer.
      If a process name is not found within this table nothing will happen.


      This read-only property is supported by the GetCommandLauncher method.
  GetDocumentCount:
    summary: The DocumentCount method returns you the number of Document Kinds. An important note is that a View is the
      actual design document. A Document type is a container that stores specific Views.
    remarks: >-
      This method is used for the DocumentCount property.


      The DocumentCount property returns you the number of Document Kinds. An important note is that a View is the
      actual design document. A Document type is a container that stores specific Views.


      This property is supported by the GetDocumentCount method.
  GetDocuments:
    summary: An editor type of server can have different document types, such as Schematic Editor and PCB Editor - these
      editor servers have two document types - SCH/SCHLIB and PCB/PCBLIB respectively.
    remarks: >-
      An add-on type of server will normally have no document containers, because they work with an editor server acting
      like a piggy back and utilising the editor server's API services.


      This method returns you the indexed document container which is represented by the IServerDocument interface.


      This method is used for the Documents property.


      This property returns you the indexed document container which is represented by the IServerDocument interface.


      This read only property is supported by the GetDocuments method.
    seeAlso:
      - DXP.IServerDocument
      - DXP.IClient
  GetHandle:
    summary: The method returns the handle of the server.
    remarks: >-
      This method is used for the Handle property.


      The Handle property returns the handle of the server. This read only property is supported by the GetHandle
      method.
  GetModuleName:
    summary: The method returns the module name of this server.
    remarks: >-
      For example the texteditor server's module name is TextEdit. This server name property is defined in the
      associated server installation file (with an INS file extension).


      This method is used for the ModuleName property.


      The ModuleName property returns the module name of this server.


      This read only property is supported by the GetModuleName method.
  GetProcessControl:
    summary: The method returns the IProcessControl interface. This interface controls the process depth for each design
      document in Altium Designer.
    remarks: >-
      Every time a process is launched on a document, the process depth is increased by one and once this same process
      has finished executing, the process depth is decreased by one. When the process depth is zero, it denotes that
      nothing is taking place on the current design document.


      This read only property is supported by the GetProcessControl method.


      The ProcessControl property returns the pointer to the IProcessControl interface. This interface controls the
      process depth for each design document in Altium Designer.
  GetViewCount:
    summary: The ViewCount method returns you the number of views for the specified server.
    remarks: >-
      A View object encapsulates a form/window object in Altium Designer normally as a global panel supported by its
      associated server.


      This method is used for the ViewCount property.


      The ViewCount property returns you the number of views for the specified server.


      This read only property is supported by the GetViewCount method.
  GetViews:
    summary: The GetViews method in conjunction with the GetViewCount method returns you the indexed View object. A view is
      a form supported by its associated server.
    remarks: >-
      This method is used for the Views property.


      The Views property in conjunction with the ViewCount property returns you the indexed View object. A view is a
      form supported by its associated server.


      This read only property is supported by the GetViews method.
    seeAlso:
      - DXP.IClient
  ReceiveNotification:
    summary: The ReceiveNotification method of the server module intercepts notifications broadcasted by Altium Designer.
    remarks: >-
      The system has a BroadCastNotification or a DispatchNotification method which all running servers in Altium
      Designer can receive and process accordingly.


      This method needs to be overridden and implemented.
  RemoveServerView:
    summary: The RemoveServerView method removes a IServerView object in Altium Designer which represents a system panel.
