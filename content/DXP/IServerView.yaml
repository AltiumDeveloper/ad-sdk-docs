# DXP.IServerView: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The IServerView interface is the ancestor interface for a document or panel view object interface.
remarks: |-
  This IServerView interface also represents a global panel in Altium Designer, for example the Messages or ToDo panels.

  IServerView interface

  IServerView Methods and Properties Table
members:
  GetIsPanel:
    summary: The IsPanel property determines whether the IServerDocumentView object is a panel or not. A IServerDocument
      container stores IServerDocumentView objects and they are can be a panel view or a document view.
    remarks: >-
      The IsPanel property returns a boolean value denoting whether the view is a panel or a document view.


      A document consists of a document view and at least one panel view. There also can be global or system views such
      as Message panel which is a global panel view.
    seeAlso:
      - DXP.IClient
      - DXP.IExternalForm
  GetViewName:
    summary: The ViewName property represents the view name and is not the same as the document filename. A view can be a
      global panel that can be seen globally within Altium Designer, as a document view or as a panel view.
    remarks: >-
      For example a library document open in Altium Designer yields the following information:


      View Name: PCBEditor


      Document Name: C:\Program Files\Altium Designer\Examples\Reference Designs\4 Port Serial Interface\Libraries\4
      Port Serial Interface.PcbLib


      Caption: PCBView_GraphicalForm


      ViewName example


      This code snippet uses the Client.CurrentView.ViewName method to find out the current document's type name.


      If StrPas(Client.CurrentView.ViewName) <> UpperCase('PCBLib') Then Exit;
    seeAlso:
      - DXP.IClient
      - DXP.IExternalForm
  ReceiveNotification:
    summary: The ReceiveNotification method captures the notification generated by Altium Designer. A global panel, a
      document view or a panel view has the ability to intercept a notification and take action accordingly.
    seeAlso:
      - DXP.IClient
      - DXP.INotification
  ViewState:
    seeAlso:
      - DXP.IClient
      - DXP.IExternalForm
