# SCH.ISch_ParameterSet: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The ISch_ParameterSet interface is a group of parameters as a design parameter set directive for a wire or a
  net on the schematic document that can be transferred to its corresponding PCB document.
members:
  Name:
    summary: The Name property determines the Parameter Set obejct's name.
