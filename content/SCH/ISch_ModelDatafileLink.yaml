# SCH.ISch_ModelDatafileLink: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: A model represents all the information needed for a component in a given domain, while a datafile entity (or
  link) is the only information which is in an external file. A model can be represented by external data sources called
  data file links. For example, pins of a component can have links to different data files, as for signal integrity
  models. We will consider each model type in respect to the data file links for the editor servers.
remarks: >-
  For the PCB footprints, the model and the data file are both the same.


  With the simulation models, you can have a simulation model which is a 4ohm resistor for example, there is a
  simulation model here, but there is no information is coming from an external file, therefore, a no external file is
  needed for this as the resistor model is built from spice. This is the case where you have a model with no data file
  entity. Thus the parameters are used for these types of simulation models that don't have data file links.


  With signal integrity models, it can have information required for each pin. If we used IBIS datafiles, not the Altium
  Designer's central database, then each signal integrity model would then have multiple data files, each one for each
  type of pin.


