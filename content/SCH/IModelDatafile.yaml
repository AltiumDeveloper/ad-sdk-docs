# SCH.IModelDatafile: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The IModelDatafile interface represents the data file (external file) that is associated with a model. Each
  model can have multiple data files (different representations of the same model type).
remarks: This interface is used within the IServerModel interface.
members:
  AddEntity:
    summary: This method adds a new entity for the datafile.
  EntityCount:
    summary: This method returns the number of entities for the data file related to the model.
    seeAlso:
      - SCH.IModelDatafile.EntityName
  EntityName:
    summary: The method returns the indexed entityname for the datafile related to the model.
    remarks: This Entitynames property returns the indexed entity name for the datafile related to the model. This property
      is supported by the Entitynames method.
    seeAlso:
      - SCH.IModelDatafile.EntityCount
  FullPath:
    summary: This method fetches the full path of the data file part of the model.
