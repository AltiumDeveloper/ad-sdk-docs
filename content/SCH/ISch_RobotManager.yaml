# SCH.ISch_RobotManager: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The ISch_RobotManager interface represents an object that can send Schematic messages into the Schematic Editor
  server from your extension to update the sub-systems such as the Undo system.
remarks: Part of ISch_ServerInterface object interface
members:
  SendMessage:
    summary: The SendMessage method sends a message into Schematic Editor notifying that the data structures need to be
      updated and synchronized. It could be an object being modified, added or deleted from the schematic document.
    parameters:
      argDestination: Normally the SCHConstant.BroadCast value, when an object is being modified, added or removed.
      argMessageID: >-
        Normally when an object is being modified, the SCHConstant.SCHMPrimitiveRegistration value. Normally when a new
        object is being added, the SCHConstant.SCHMBeginModify and SCHConstant.SCHMEndModify values. Normally when an
        object is being removed, the SCHConstant.SCHMPrimitiveRegistration value.
      argMessageData: Normally when a new object is being added, the SCHConstant.NoEventData value.
