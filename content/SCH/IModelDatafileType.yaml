# SCH.IModelDatafileType: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The IModelDatafileType interface represents the data file type for the specified model. Simulation Model has
  three model types and thus three data files, PCB LIB has one model type and one data file, PCB3DLib has one model type
  and one data file and SI has one model type and one data file.
remarks: The IModelDatafileType interface is used by the IModelTypeManager
members:
  Description:
    summary: "This method returns the description string for this IModelDatafiletype interface depending on the model's data
      file type. Since Altium Designer supports four models and six model types:"
    seeAlso:
      - SCH.IModelTypeManager
  EntityType:
    summary: "This method returns the Entity type string for this IModelDatafiletype interface depending on the model's data
      file type. Since Altium Designer supports four models and six model types:"
    seeAlso:
      - SCH.IModelTypeManager
  ExtensionFilter:
    summary: "This method returns the extension filter string for this IModelDatafiletype interface depending on the model's
      data file type. Since Altium Designer supports four models and six model types:"
    seeAlso:
      - SCH.IModelTypeManager
  FileKind:
    summary: "This method returns the FileKind string for this IModelDatafiletype interface depending on the model's data
      file type. Since Altium Designer supports four models and six model types:"
    seeAlso:
      - SCH.IModelTypeManager
  ModelType:
    summary: "This method returns the ModelType string for this IModelDatafiletype interface depending on the model's data
      file type. Since Altium Designer supports four models and six model types:"
    seeAlso:
      - SCH.IModelTypeManager
  SupportsParameters:
    summary: "This method returns the SupportsParameters Boolean value for this IModelDatafiletype interface depending on
      the model's data file type. Since Altium Designer supports four models and six model types:"
    seeAlso:
      - SCH.IModelTypeManager
