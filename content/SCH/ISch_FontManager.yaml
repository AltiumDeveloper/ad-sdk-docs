# SCH.ISch_FontManager: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The ISch_FontManager interface represents the internal font manager in Schematic Editor that manages fonts for
  text based objects on schematic documents.
remarks: To have access to the ISch_FontManager interface, read `SCH.GlobalVars.SchServer`;
members:
  Bold:
    summary: This Bold property determines the Bold style for the font.
    seeAlso:
      - SCH.ISch_FontManager.GetFontID
  FontCount:
    summary: The FontCount property returns the number of fonts used in the computer system that the Altium Designer is
      currently residing on.
  FontName:
    summary: This indexed FontName property returns the name of an indexed font as a string. Every computer could have a
      different table of fonts used.
  GetFontID:
    summary: This method retrieves the font ID of TFontID type that can be used to set the font style of a text based object
      such as a ISch_Label object.
  GetFontSpec:
    summary: Every font used in the Schematic document has its own FontID. You can invoke the GetFontSpec method to retrieve
      font specifications for the supplied Font ID.
  IsFontVertical:
    summary: This method determines whether the font is vertically orientated or not.
  Italic:
    summary: This Italic property determines the Italic style for the font.
    seeAlso:
      - SCH.ISch_FontManager.GetFontID
  Rotation:
    summary: The Rotation property determines the orientation of the text object. For ISch_Labels, it is necessary to set
      the Orientation property of these ISch_Labels as well as the Rotation property for the FontID variables.
  Size:
    summary: The Size property determines the font size.
    seeAlso:
      - SCH.ISch_FontManager.GetFontID
  StrikeOut:
    summary: The StrikeOut property determines whether the font is striked out or not.
    seeAlso:
      - SCH.ISch_FontManager.GetFontID
  UnderLine:
    summary: This UnderLine property determines whether the font is underlined or not.
    seeAlso:
      - SCH.ISch_FontManager.GetFontID
