# SCH.ILibraryServer: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: The integrated library server, the entry point to the library data reader.
remarks: >-
  Get it from the client's server module named `IntegratedLibrary`: cast
  `DXP.GlobalVars.Client.GetServerModuleByName("IntegratedLibrary")` to `ILibraryServer`. `GetDataReader` returns the
  `SCH.ILibraryDataReader` that registers library files and reads their entries.
