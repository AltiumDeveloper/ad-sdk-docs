# SCH.ISch_NetLabel: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: A net describes a connection from one component pin, to a second pin, and then to a third pin and so on. A net
  label is a text string with the text property that holds the net name that attachs to a connection such as wires. A
  net label object is represented by the ISch_NetLabel interface.
remarks: |-
  Text property is the net name of the net label.

  ISch_NetLabel itself has no properties or methods but has inherited properties and methods.
