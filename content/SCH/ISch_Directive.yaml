# SCH.ISch_Directive: descriptions for the generated reference. Members are keyed by page name (property or method).
summary: An ISch_Directive interface represents an object that stores a text string. It is an ancestor interface for the
  ISch_ErrorMarker interface. Design constraints (rules) can be defined prior to PCB layout, by adding parameters that
  are configured as design rule directives to the schematic source document(s).
