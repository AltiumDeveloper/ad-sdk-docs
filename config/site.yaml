# Site-wide settings shared by docusaurus.config.js and the generator scripts.
title: Altium Designer SDK
tagline: .NET API reference for building Altium Designer extensions
url: https://altiumdeveloper.github.io
baseUrl: /ad-sdk-docs/
repo: https://github.com/AltiumDeveloper/ad-sdk-docs
branch: main

# The SDK samples: reference pages list the samples that use each type and member. The build reads one pinned
# release of the samples index, so it is reproducible; moving the pin is a reviewed change.
# `npm run samples:fetch` downloads it into .cache/samples/.
samples:
  repo: https://github.com/AltiumDeveloper/ad-sdk-samples
  release: index-2026.11.16.5
